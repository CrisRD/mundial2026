<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="application-name" content="Mundial 2026">

<link rel="apple-touch-icon" href="Primerlogo.png">
<link rel="icon" type="image/png" href="Primerlogo.png">

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<style>
:root {
  --gold:       #B8965A;
  --gold-light: #C9A96E;
  --gold-dim:   rgba(184,150,90,0.12);
  --bg1:  #F5F2ED;
  --bg2:  #FDFCFA;
  --bg3:  #EDEAE4;
  --bg4:  #E4E0D8;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.05);
  --text1: #1A1814;
  --text2: #5A5650;
  --text3: #9C968E;
  --serif: 'Libre Baskerville', Georgia, serif;
  --sans:  'DM Sans', sans-serif;
  --tab-h: 64px;
  --r: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg1);
  color: var(--text1);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
}

/* ── SHELL ── */
#app {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg1);
  overflow: hidden;
}

/* ── MASTHEAD ── */
#masthead {
  background: var(--bg2);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.masthead-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 16px 18px 12px;
}
.wordmark {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text1);
  line-height: 1;
}
.wordmark em { color: var(--gold); font-style: normal; }
.masthead-meta {
  font-size: 11px;
  color: var(--text3);
  font-weight: 400;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.gold-rule {
  height: 1.5px;
  background: linear-gradient(90deg, var(--gold) 0%, transparent 80%);
  margin: 0 18px;
}
.search-wrap {
  padding: 10px 18px 12px;
  position: relative;
}
.search-icon {
  position: absolute;
  left: 30px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  stroke: var(--text3);
  pointer-events: none;
}
#search-input {
  width: 100%;
  background: var(--bg1);
  border: 1.5px solid var(--border);
  border-radius: 24px;
  padding: 9px 16px 9px 38px;
  color: var(--text1);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 400;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#search-input::placeholder { color: var(--text3); }
#search-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(184,150,90,0.12);
}

/* ── TABS ── */
#tabs {
  display: flex;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  height: var(--tab-h);
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text3);
  font-size: 12px;
  font-weight: 400;
  position: relative;
  padding-top: 2px;
  user-select: none;
  transition: color 0.2s;
}
.tab::before {
  content: '';
  position: absolute;
  top: 0; left: 24%; right: 24%;
  height: 2px;
  background: var(--gold);
  border-radius: 0 0 2px 2px;
  transform: scaleX(0);
  transition: transform 0.25s cubic-bezier(.4,0,.2,1);
}
.tab.active { color: var(--text1); font-weight: 600; }
.tab.active::before { transform: scaleX(1); }
.tab svg { width: 22px; height: 22px; }

/* ── CONTENT ── */
#content {
  flex: 1;
  overflow: hidden;
  background: var(--bg1);
  display: flex;
  flex-direction: column;
}

/* ── PHASE CHIPS ── */
.phase-bar {
  display: flex;
  gap: 7px;
  padding: 10px 18px;
  overflow-x: auto;
  flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border2);
}
.phase-bar::-webkit-scrollbar { display: none; }
.chip {
  white-space: nowrap;
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 400;
  color: var(--text2);
  cursor: pointer;
  background: transparent;
  font-family: var(--sans);
  transition: all 0.18s;
}
.chip.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold);
  font-weight: 500;
}

/* ── VIEWS ── */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }
.view-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 12px;
}
.view-scroll::-webkit-scrollbar { display: none; }

/* ── DAY HEADER ── */
.day-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 18px 8px;
}
.day-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  white-space: nowrap;
}
.day-rule {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.group-teams-strip {
  font-size: 11px;
  color: var(--text3);
  padding: 4px 18px 10px;
  letter-spacing: 0.2px;
}

/* ── MATCH ROW ── */
.match-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  padding: 11px 18px 9px;
  gap: 0;
  position: relative;
}
.match-row + .match-row { border-top: 1px solid var(--border2); }
.match-row.highlight { background: rgba(184,150,90,0.06); }

/* home side */
.m-home {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
  min-width: 0;
}
.m-home-info { display: flex; flex-direction: column; min-width: 0; }
.m-team-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.m-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  flex-basis: 100%;
  padding-top: 4px;
}
.m-group {
  font-size: 11px;
  font-weight: 500;
  color: var(--gold);
}
.m-sep { font-size: 10px; color: var(--text3); }
.m-venue { font-size: 11px; color: var(--text3); }

/* center */
.m-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 14px;
  flex-shrink: 0;
}
.m-time {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  color: var(--text2);
  letter-spacing: 0.3px;
}
.m-time.score {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
}
.m-status {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.3px;
}
.m-status.live {
  color: #E03E3E;
  font-weight: 600;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* away side */
.m-away {
  display: flex;
  align-items: center;
  gap: 9px;
  justify-content: flex-end;
  flex: 1;
  min-width: 0;
}
.m-away .m-team-name { text-align: right; }

/* ── FLAG CIRCLE ── */
.fc {
  width: 32px; height: 32px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.fc .fi {
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  border-radius: 50%;
  display: block;
}
.fc svg { width: 32px; height: 32px; display: block; }
.fc.lg { width: 40px; height: 40px; }
.fc.lg svg { width: 40px; height: 40px; }
.fc.xl { width: 56px; height: 56px; border-width: 2px; }
.fc.xl svg { width: 56px; height: 56px; }

/* ── TEAMS GRID ── */
.group-section { padding: 0 18px 4px; }
.group-label {
  font-family: var(--serif);
  font-size: 13px;
  font-style: normal;
  color: var(--gold);
  padding: 16px 0 8px;
}
.teams-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.team-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 6px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s;
}
.team-card:active { border-color: var(--gold); background: var(--bg3); }
.team-card .tname {
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  text-align: center;
  line-height: 1.25;
}

/* ── TEAM DETAIL ── */
#team-detail {
  position: absolute;
  inset: 0;
  background: var(--bg1);
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
}
#team-detail.open { transform: translateX(0); }
#team-detail::-webkit-scrollbar { display: none; }

.detail-head {
  background: var(--bg2);
  padding: 16px 18px 18px;
  border-bottom: 1px solid var(--border);
}
.back-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--gold);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 14px;
}
.back-btn svg { width: 16px; height: 16px; stroke: var(--gold); flex-shrink:0; }
.detail-title-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.detail-title-row h2 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--text1);
  line-height: 1.1;
}
.detail-coach { font-size: 12px; color: var(--text3); margin-top: 3px; }
.detail-badge {
  display: inline-block;
  background: var(--gold-dim);
  border: 1px solid rgba(184,150,90,0.4);
  color: var(--gold);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 20px;
  margin-top: 5px;
  letter-spacing: 0.3px;
}
.stats-strip {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.stat-cell {
  flex: 1;
  padding: 14px 0;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat-cell:last-child { border-right: none; }
.stat-n {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  display: block;
}
.stat-l { font-size: 10px; color: var(--text3); letter-spacing: 0.3px; }
.sec-title {
  font-family: var(--serif);
  font-style: normal;
  font-size: 13px;
  color: var(--gold);
  padding: 14px 18px 8px;
}
.match-mini-list { padding: 0 18px; display: flex; flex-direction: column; gap: 7px; margin-bottom: 4px; }
.match-mini {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.match-mini.h { border-color: rgba(184,150,90,0.4); }
.match-mini-teams { font-size: 13px; font-weight: 500; color: var(--text1); }
.match-mini-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
.squad-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 8px;
  padding: 0 18px 20px;
}
.player-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s, transform 0.12s;
  position: relative;
}
.player-card:active {
  border-color: var(--gold);
  background: var(--bg3);
  transform: scale(0.97);
}
.player-card::after {
  display: none;
}
.player-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--gold);
  overflow: hidden;
  flex-shrink: 0;
}
.player-avatar img { width: 100%; height: 100%; object-fit: cover; }
.p-num { font-family: var(--serif); font-size: 11px; color: var(--gold); font-weight: 700; }
.p-name { font-size: 11px; font-weight: 500; color: var(--text2); text-align: center; line-height: 1.25; }
.p-pos { font-size: 9px; color: var(--text3); }
.p-club { font-size: 10px; color: var(--text3); text-align: center; line-height: 1.2; margin-top: 1px; }

/* ── CALENDAR ── */
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 10px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.cal-nav h2 {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--text1);
  text-transform: capitalize;
}
.cal-nav-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  width: 30px; height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text2);
  transition: background 0.15s;
}
.cal-nav-btn:active { background: var(--bg3); }
.cal-nav-btn svg { width: 14px; height: 14px; stroke: currentColor; }
.cal-grid-wrap { padding: 10px 18px 14px; }
.cal-dow-row {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  margin-bottom: 4px;
}
.cal-dow {
  text-align: center;
  font-size: 10px;
  color: var(--text3);
  font-weight: 500;
  letter-spacing: 0.3px;
  padding: 3px 0;
}
.cal-days {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 2px;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text2);
  gap: 2px;
  transition: background 0.15s;
}
.cal-day.has-match { color: var(--text2); background: var(--bg3); }
.cal-day.team-match { background: var(--gold-dim) !important; color: var(--gold) !important; font-weight: 600; }
.cal-day.dimmed { opacity: 0.3; }
.cal-day:active { background: var(--bg4); }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0.5; }
.cal-day.team-match .cal-dot { opacity: 1; }
.cal-legend { padding: 0 18px 20px; }
.cal-day-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 14px 0 5px;
}
.cal-legend-title {
  font-family: var(--serif);
  font-style: normal;
  font-size: 13px;
  color: var(--gold);
  padding: 4px 0 10px;
}
.cal-day-group {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 0;
}
.cal-match-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border2);
}
.cal-match-item:last-child { border-bottom: none; }
.cal-match-item.h { background: rgba(184,150,90,0.05); }
.cal-match-item:active { background: var(--bg3); }
.cal-mi-left {}
.cal-mi-teams { font-size: 13px; font-weight: 500; color: var(--text1); }
.cal-mi-time { font-size: 11px; color: var(--text3); margin-top: 1px; }
.cal-mi-right { font-size: 10px; color: var(--text3); }

/* ── DAY MODAL ── */
#day-modal {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 60;
  align-items: flex-end;
  justify-content: center;
}
#day-modal.open { display: flex; }
#day-modal-box {
  background: var(--bg2);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-height: 70vh;
  overflow-y: auto;
  padding: 0 0 24px;
  animation: slideUp 0.25s cubic-bezier(.4,0,.2,1);
}
#day-modal-box::-webkit-scrollbar { display: none; }
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 14px;
}
.modal-day-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 0 18px 10px;
}
.modal-match-row {
  display: flex;
  align-items: center;
  padding: 10px 18px;
  border-top: 1px solid var(--border2);
  gap: 0;
}
.modal-match-row .m-home { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.modal-match-row .m-away { display:flex; align-items:center; gap:8px; justify-content:flex-end; flex:1; min-width:0; }
.modal-match-row .m-away .m-team-name { text-align:right; }
.modal-match-row .m-center { padding: 0 12px; flex-shrink:0; text-align:center; }

/* ── PLAYER SHEET ── */
#player-sheet {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 70;
  align-items: flex-end;
  justify-content: center;
}
#player-sheet.open { display: flex; }
#player-sheet-box {
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 82vh;
  overflow-y: auto;
  padding-bottom: 32px;
  animation: slideUp 0.28s cubic-bezier(.4,0,.2,1);
}
#player-sheet-box::-webkit-scrollbar { display: none; }

.ps-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
}
.ps-hero {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.ps-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--bg3);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  overflow: hidden;

function flag(id, sz) {
  sz = sz || 32;
  const s = `width:${sz}px;height:${sz}px;`;
  const cls = `fc${sz===40?' lg':sz===56?' xl':''}`;
  const iso = {'usa':'us', 'can':'ca', 'mex':'mx', 'uru':'uy', 'arg':'ar', 'bra':'br', 'esp':'es', 'mar':'ma', 'por':'pt', 'fra':'fr', 'ger':'de', 'sco':'gb-sct', 'sui':'ch', 'bel':'be', 'eng':'gb-eng', 'ned':'nl', 'aut':'at', 'tur':'tr', 'cro':'hr', 'jpn':'jp', 'col':'co', 'ksa':'sa', 'gha':'gh', 'kor':'kr', 'aus':'au', 'sen':'sn', 'ecu':'ec', 'par':'py', 'cdi':'ci', 'nzl':'nz', 'ira':'ir', 'rsa':'za', 'cze':'cz', 'bih':'ba', 'qat':'qa', 'hat':'ht', 'cur':'cw', 'tun':'tn', 'swe':'se', 'cpv':'cv', 'irq':'iq', 'nor':'no', 'alg':'dz', 'jor':'jo', 'cod':'cd', 'uzb':'uz', 'pan':'pa', 'egy':'eg'};
  const code = iso[id];
  if (code) {
    return `<div class="${cls}" style="${s}"><span class="fi fi-${code} fis" style="width:${sz}px;height:${sz}px;background-size:cover;"></span></div>`;
  }
  // Fallback initials
  const colors=['#2563EB','#DC2626','#16A34A','#D97706','#7C3AED','#0891B2'];
  const h=id.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const bc=colors[h%colors.length];
  const lt=id.substring(0,2).toUpperCase();
  return `<div class="${cls}" style="${s}"><svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="fcc${id}${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${sz/2}"/></clipPath></defs><g clip-path="url(#fcc${id}${sz})"><rect width="${sz}" height="${sz}" fill="${bc}"/><text x="${sz/2}" y="${sz/2+4}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${sz*0.35}" font-weight="700" fill="rgba(255,255,255,0.9)">${lt}</text></g></svg></div>`;
}

function tname(id){return(TEAM_INFO[id]||{name:id.toUpperCase()}).name;}
// Normaliza para búsquedas: minúsculas + sin tildes/acentos.
const normTxt = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
// ¿Coincide una selección (por id) con la consulta ya normalizada? Casa por
// nombre sin tildes y por código de 3 letras (bel, bél, BÉLGICA, belgica…).
function teamHit(id, ql){
  if(!ql) return true;
  return normTxt(tname(id)).includes(ql) || id.toLowerCase().includes(ql);
}
// Orden de convocatoria: por posición (PO→DEF→MED→DEL) y dentro de cada
// posición por dorsal ascendente. Devuelve una copia; no muta el array original.
const POS_ORDER = {PO:0, DEF:1, MED:2, DEL:3};
function sortSquad(squad){
  const rank = p => (p.pos in POS_ORDER) ? POS_ORDER[p.pos] : 9;
  const num = p => (typeof p.n === 'number') ? p.n : 999;
  return squad.slice().sort((a,b) => (rank(a) - rank(b)) || (num(a) - num(b)));
}

function fmtDate(d){
  const dt=new Date(d+'T00:00:00');
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${dias[dt.getDay()].toUpperCase()} ${dt.getDate()} ${meses[dt.getMonth()].toUpperCase()}`;
}

function matchRowHTML(m, ql) {
  const hi=ql&&(teamHit(m.home,ql)||teamHit(m.away,ql));
  const isGroup = m.phase==='groups';
  const homeName = isGroup ? tname(m.home) : m.home;
  const awayName = isGroup ? tname(m.away) : m.away;
  const homeFlag = isGroup ? flag(m.home,32) : `<div class="fc" style="width:32px;height:32px;background:var(--bg3);display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid var(--border);"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--text3)" stroke-width="1.5"><path d="M12 2L3.5 5.5v6c0 4.5 3.6 8.7 8.5 9.5 4.9-.8 8.5-5 8.5-9.5v-6L12 2z"/></svg></div>`;
  const awayFlag = isGroup ? flag(m.away,32) : `<div class="fc" style="width:32px;height:32px;background:var(--bg3);display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid var(--border);"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--text3)" stroke-width="1.5"><path d="M12 2L3.5 5.5v6c0 4.5 3.6 8.7 8.5 9.5 4.9-.8 8.5-5 8.5-9.5v-6L12 2z"/></svg></div>`;
  return `<div class="match-row${hi?' highlight':''}" onclick="">
    <div class="m-home">
      ${homeFlag}
      <div class="m-home-info">
        <div class="m-team-name">${homeName}</div>
      </div>
    </div>
    <div class="m-center">
      <div class="m-time${m.score?' score':''}">${m.score||m.time}</div>
      ${m.scoreLabel?`<div class="m-status${m.scoreLive?' live':''}">${m.scoreLabel}</div>`:''}
    </div>
    <div class="m-away">
      <div class="m-team-name">${awayName}</div>
      ${awayFlag}
    </div>
    <div class="m-meta">
      ${isGroup?`<span class="m-group">Grupo ${m.group}</span><span class="m-sep">·</span>`:''}
      <span class="m-venue">${m.venue.split(',')[1]?m.venue.split(',')[1].trim():m.venue}</span>
    </div>
  </div>`;
}

function renderMatches(){
  const ql=normTxt(q);
  let ms=MATCHES.filter(m=>{
    if(phase!=='all'&&m.phase!==phase)return false;
    if(ql){return teamHit(m.home,ql)||teamHit(m.away,ql);}
    return true;
  });
  const el=document.getElementById('matches-list');
  if(!ms.length){el.innerHTML='<div class="empty-state">Sin partidos para mostrar</div>';return;}

  // Fase de grupos → agrupar por grupo A-L
  if(phase==='groups'&&!ql){
    const byGroup={};
    ms.forEach(m=>{if(!byGroup[m.group])byGroup[m.group]=[];byGroup[m.group].push(m);});
    const groups=Object.keys(byGroup).sort();
    el.innerHTML=groups.map(g=>{
      const rows=byGroup[g];
      // Get the 4 teams in this group from the matches
      const teams=[];
      rows.forEach(m=>{if(!teams.includes(m.home))teams.push(m.home);if(!teams.includes(m.away))teams.push(m.away);});
      const teamsLabel=teams.map(t=>tname(t)).join(' · ');
      return `<div class="day-header">
        <div class="day-label">Grupo ${g}</div>
        <div class="day-rule"></div>
      </div>
      <div class="group-teams-strip">${teamsLabel}</div>`+
      rows.map(m=>matchRowHTML(m,ql)).join('');
    }).join('');
    return;
  }

  // Todos / fase eliminatoria / búsqueda → agrupar por fecha
  const byDate={};
  ms.forEach(m=>{if(!byDate[m.date])byDate[m.date]=[];byDate[m.date].push(m);});
  const dates=Object.keys(byDate).sort();
  el.innerHTML=dates.map(date=>{
    return `<div class="day-header"><div class="day-label">${fmtDate(date)}</div><div class="day-rule"></div></div>`+
    byDate[date].map(m=>matchRowHTML(m,ql)).join('');
  }).join('');
}

function renderCalendar(){
  const yr=calMo.getFullYear(),mo=calMo.getMonth();
  const meses2=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mname=`${meses2[mo]} ${yr}`;
  const first=new Date(yr,mo,1).getDay();
  const days=new Date(yr,mo+1,0).getDate();
  const off=(first===0)?6:first-1;
  const ql=normTxt(q);

  const mdays={};
  MATCHES.forEach(m=>{
    const d=new Date(m.date+'T00:00:00');
    if(d.getMonth()===mo&&d.getFullYear()===yr){
      const k=d.getDate();
      if(!mdays[k])mdays[k]=[];
      mdays[k].push(m);
    }
  });

  const teamDays=new Set();
  if(ql){Object.entries(mdays).forEach(([d,ms])=>{ms.forEach(m=>{if(teamHit(m.home,ql)||teamHit(m.away,ql))teamDays.add(+d);});});}

  const dows=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const legend=Object.entries(mdays).sort((a,b)=>a[0]-b[0]).flatMap(([,ms])=>ms)
    .filter(m=>!ql||(teamHit(m.home,ql)||teamHit(m.away,ql)));

  document.getElementById('calendar-view').innerHTML=`
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="chMo(-1)"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <h2>${mname}</h2>
      <button class="cal-nav-btn" onclick="chMo(1)"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-dow-row">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
      <div class="cal-days">
        ${Array(off).fill('<div></div>').join('')}
        ${Array.from({length:days},(_,i)=>{
          const d=i+1,has=!!mdays[d],isTeam=teamDays.has(d),dim=ql&&has&&!isTeam;
          let cls='cal-day';if(has)cls+=' has-match';if(isTeam)cls+=' team-match';if(dim)cls+=' dimmed';
          return `<div class="${cls}" onclick="jumpDate('${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}')">${d}${has?'<div class="cal-dot"></div>':''}</div>`;
        }).join('')}
      </div>
    </div>
    <div class="cal-legend">
      ${(()=>{
        const matches = ql ? legend : legend.slice(0,20);
        if(!matches.length) return '<div class="empty-state" style="font-style:normal">Sin partidos este mes</div>';
        const byDay={};
        matches.forEach(m=>{if(!byDay[m.date])byDay[m.date]=[];byDay[m.date].push(m);});
        return Object.keys(byDay).sort().map(date=>{
          const ms=byDay[date];
          const dt=new Date(date+'T00:00:00');
          const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
          const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
          const dayLabel=`${dias[dt.getDay()]} ${dt.getDate()} ${meses[dt.getMonth()]}`;
          return `<div class="cal-day-header">${dayLabel}</div>
            <div class="cal-day-group">`+
            ms.map(m=>{
              const isH=ql&&(teamHit(m.home,ql)||teamHit(m.away,ql));
              return `<div class="cal-match-item${isH?' h':''}" onclick="jumpDate('${m.date}')">
                <div class="cal-mi-left">
                  <div class="cal-mi-teams">${tname(m.home)} · ${tname(m.away)}</div>
                  <div class="cal-mi-time">${m.time} h · Grupo ${m.group}</div>
                </div>
              </div>`;
            }).join('')+
            `</div>`;
        }).join('');
      })()}
    </div>
  `;
}

function chMo(d){calMo=new Date(calMo.getFullYear(),calMo.getMonth()+d,1);renderCalendar();}

function openDayModal(date){
  const dt=new Date(date+'T00:00:00');
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dayLabel=`${dias[dt.getDay()]} ${dt.getDate()} ${meses[dt.getMonth()]}`;
  const ms=MATCHES.filter(m=>m.date===date);
  if(!ms.length) return;
  document.getElementById('day-modal-content').innerHTML=`
    <div class="modal-handle"></div>
    <div class="modal-day-title">${dayLabel.toUpperCase()}</div>
    ${ms.map(m=>`
      <div class="modal-match-row">
        <div class="m-home">
          ${flag(m.home,28)}
          <div class="m-team-name">${tname(m.home)}</div>
        </div>
        <div class="m-center">
          <div class="m-time${m.score?' score':''}">${m.score||m.time}</div>
          ${m.scoreLabel?`<div class="m-status${m.scoreLive?' live':''}">${m.scoreLabel}</div>`:''}
        </div>
        <div class="m-away">
          <div class="m-team-name">${tname(m.away)}</div>
          ${flag(m.away,28)}
        </div>
      </div>
      <div style="padding:2px 18px 6px; display:flex; gap:5px;">
        <span class="m-group">Grupo ${m.group}</span>
        <span class="m-sep">·</span>
        <span class="m-venue">${m.venue.split(',')[1]?m.venue.split(',')[1].trim():m.venue}</span>
      </div>`).join('')}
  `;
  document.getElementById('day-modal').classList.add('open');
}
function closeDayModal(){
  document.getElementById('day-modal').classList.remove('open');
}
function jumpDate(date){ openDayModal(date); }

function renderTeams(){
  const ql=normTxt(q);
  const groups={};
  Object.entries(TEAM_INFO).forEach(([id,t])=>{
    if(ql&&!teamHit(id,ql))return;
    if(!groups[t.group])groups[t.group]=[];
    groups[t.group].push({...t,id});
  });
  const el=document.getElementById('teams-list');
  const keys=Object.keys(groups).sort();
  if(!keys.length){el.innerHTML='<div class="empty-state">Sin resultados</div>';return;}
  el.innerHTML=keys.map(g=>`
    <div class="group-section">
      <div class="group-label">Grupo ${g}</div>
      <div class="teams-grid">
        ${groups[g].map(t=>`<div class="team-card" onclick="openTeam('${t.id}')">
          ${flag(t.id,40)}
          <div class="tname">${t.name}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

function openPlayerSheet(teamId, playerIdx){
  const t = TEAM_INFO[teamId] || {};
  const sq = t.squad || [];
  const p = sq[playerIdx];
  if(!p) return;

  const teamMatches = MATCHES.filter(m => m.home===teamId || m.away===teamId);
  const initials = p.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  const avatarHTML = p.photo
    ? `<img src="${p.photo}" onerror="this.parentElement.textContent='${initials}'">`
    : initials;

  const posLabel = {PO:'Portero', DEF:'Defensa', MED:'Centrocampista', DEL:'Delantero'}[p.pos] || p.pos;

  // Edad y altura (la API devuelve "187 cm" → mostramos "1,87 m")
  const fmtHeight = h => {
    const cm = parseInt(String(h).replace(/[^0-9]/g,''), 10);
    return cm ? (cm/100).toFixed(2).replace('.', ',') + ' m' : '';
  };
  const metaBits = [];
  if(p.age) metaBits.push(p.age + ' años');
  if(p.height && fmtHeight(p.height)) metaBits.push(fmtHeight(p.height));
  const metaExtra = metaBits.length
    ? `<span style="font-size:12px;color:var(--text2);">· ${metaBits.join(' · ')}</span>`
    : '';

  document.getElementById('player-sheet-content').innerHTML = `
    <div class="ps-handle"></div>
    <div class="ps-hero">
      <div class="ps-avatar">${avatarHTML}</div>
      <div class="ps-hero-info">
        <div class="ps-num">${p.n}</div>
        <div class="ps-name">${p.name}</div>
        <div class="ps-meta" style="margin-top:6px; gap:8px; align-items:center;">
          <span class="ps-tag-pos">${posLabel}</span>
          ${metaExtra}
        </div>
        ${p.club ? `<div class="ps-club">· ${p.club} ·</div>` : ''}
      </div>
    </div>

    <div class="ps-stats">
      <div class="ps-stat"><span class="ps-stat-n">0</span><span class="ps-stat-l">goles</span></div>
      <div class="ps-stat"><span class="ps-stat-n">0</span><span class="ps-stat-l">asistencias</span></div>
      <div class="ps-stat"><span class="ps-stat-n">0'</span><span class="ps-stat-l">minutos</span></div>
      <div class="ps-stat"><span class="ps-stat-n">0</span><span class="ps-stat-l">tarjetas</span></div>
    </div>

    <div class="ps-note">Estadísticas del Mundial 2026</div>

    <div style="height:8px"></div>
  `;

  // Swipe down to close
  const box = document.getElementById('player-sheet-box');
  let startY = 0;
  box.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
  box.addEventListener('touchend', e => { if(e.changedTouches[0].clientY - startY > 60) closePlayerSheet(); }, {passive:true});

  document.getElementById('player-sheet').classList.add('open');
}

function closePlayerSheet(){
  document.getElementById('player-sheet').classList.remove('open');
}

function closeTeam(){currentTeamId=null;document.getElementById('team-detail').classList.remove('open');}

// API-FOOTBALL
// ══════════════════════════════════════
const API_KEY = '31d66c2cbb8035670e626538f5213c41';
const API_BASE = 'https://v3.football.api-sports.io';
const WC_LEAGUE = 1;
const WC_SEASON = 2026;

// Mapa selección (código local) -> ID de equipo en API-Football.
// Si una selección no está aquí, el cargador simplemente no se ejecuta para ella.
const API_IDS = {
  // 48/48 verificados desde /teams?league=1&season=2026 (descubrimiento del 04/06/2026).
  // Corrige 12 IDs que antes apuntaban al equipo equivocado (p. ej. ned, bel, sui, jpn, kor).
  usa:2384, can:5529, mex:16, uru:7, arg:26, bra:6, esp:9, mar:31,
  por:27, fra:2, ger:25, sco:1108, sui:15, bel:1, eng:10, ned:1118,
  aut:775, tur:777, cro:3, jpn:12, col:8, ksa:23, gha:1504, kor:17,
  aus:20, sen:13, ecu:2382, par:2380, cdi:1501, nzl:4673, ira:22, rsa:1531,
  cze:770, bih:1113, qat:1569, hat:2386, cur:5530, tun:28, swe:5, cpv:1533,
  irq:1567, nor:1090, alg:1532, jor:1548, cod:1508, uzb:1568, pan:11, egy:32
};
let currentTeamId = null;
let liveRefreshTimer = null;

async function apiFetch(endpoint){
  try {
    const r = await fetch(`${API_BASE}${endpoint}`, {
      headers: { 'x-apisports-key': API_KEY }
    });
    return await r.json();
  } catch(e) { console.warn('API error:', e); return null; }
}

async function loadFixtures(){
  showApiStatus('Actualizando resultados…');
  const data = await apiFetch(`/fixtures?league=${WC_LEAGUE}&season=${WC_SEASON}`);
  if(!data || !data.response){ hideApiStatus(); return; }

  data.response.forEach(f => {
    const home = f.teams.home.name.toLowerCase();
    const away = f.teams.away.name.toLowerCase();
    const date = f.fixture.date?.substring(0,10);
    const status = f.fixture.status.short;
    const elapsed = f.fixture.status.elapsed;

    // Match to local by team name or date+time proximity
    const match = MATCHES.find(m => {
      const mh = tname(m.home).toLowerCase();
      const ma = tname(m.away).toLowerCase();
      return (mh === home || mh.includes(home.split(' ')[0])) &&
             (ma === away || ma.includes(away.split(' ')[0]));
    }) || MATCHES.find(m => m.date === date);

    if(!match) return;

    match.fixtureId = f.fixture.id;
    match.status = status;

    const liveStatuses = ['1H','2H','HT','ET','P','BT'];
    const finishedStatuses = ['FT','AET','PEN'];

    if([...liveStatuses, ...finishedStatuses].includes(status)){
      const h = f.goals.home ?? 0;
      const a = f.goals.away ?? 0;
      match.score = `${h}—${a}`;
      match.scoreLive = liveStatuses.includes(status);
      match.scoreLabel = status === 'HT' ? 'Descanso' :
                         finishedStatuses.includes(status) ? 'Final' :
                         `${elapsed}'`;
    } else {
      match.score = null;
      match.scoreLive = false;
      match.scoreLabel = null;
    }
  });

  hideApiStatus();
  render();

  // Auto-refresh if live matches
  clearTimeout(liveRefreshTimer);
  if(MATCHES.some(m => m.scoreLive)){
    liveRefreshTimer = setTimeout(loadFixtures, 60000);
  }
}

async function loadPlayerPhotos(teamLocalId, teamApiId){
  if(!teamApiId) return 0;
  const team = TEAM_INFO[teamLocalId];
  if(!team || !team.squad) return 0;
  // Normaliza nombres: sin acentos, minúsculas, y separa apóstrofos/puntos/guiones.
  const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[.'`´’\-]/g,' ').replace(/\s+/g,' ').trim();
  // Tokens significativos (>=4 letras) para no confundir "Marc" con "Marcos".
  const toks = s => norm(s).split(' ').filter(w => w.length >= 4);
  // /players/squads: plantilla actual con foto, edad, dorsal y posición.
  // No depende de temporada, así que responde ya (no como /players?season=2026).
  const data = await apiFetch(`/players/squads?team=${teamApiId}`);
  const players = data && data.response && data.response[0] && data.response[0].players;
  if(!players || !players.length) return 0;

  // Pre-tokeniza local y API.
  const locals = team.squad.map((s, i) => ({ i, tok: toks(s.name) }));
  const apis   = players.map(a => ({ a, tok: toks(a.name) }));

  // Genera pares con solapamiento de palabras completas; puntúa por nº de
  // coincidencias y suma un bonus fuerte si el dorsal coincide (desempate).
  const pairs = [];
  locals.forEach(L => {
    apis.forEach(A => {
      let shared = 0;
      L.tok.forEach(w => { if(A.tok.indexOf(w) !== -1) shared++; });
      if(!shared) return;
      let score = shared * 10;
      const an = A.a.number, ln = team.squad[L.i].n;
      if(an != null && ln != null && Number(an) === Number(ln)) score += 100;
      pairs.push({ score, li: L.i, a: A.a });
    });
  });
  // Asignación voraz 1-a-1: la mejor puntuación primero; cada jugador local y
  // cada jugador de la API se usan una sola vez (evita robos de foto).
  pairs.sort((x, y) => y.score - x.score);
  const usedLocal = new Set(), usedApi = new Set();
  let count = 0;
  pairs.forEach(pr => {
    if(usedLocal.has(pr.li) || usedApi.has(pr.a)) return;
    usedLocal.add(pr.li); usedApi.add(pr.a);
    const local = team.squad[pr.li];
    if(pr.a.photo) local.photo = pr.a.photo;
    if(pr.a.age != null) local.age = pr.a.age;
    count++;
  });
  return count;
}

// Orquestador del cargador: al abrir una selección, pide sus datos a la API una
// sola vez y, si llegan, repinta la ficha para mostrar foto, edad y altura.
// Nunca toca dorsales ni clubes: lo manual manda siempre.
async function ensureSquadData(id){
  const t = TEAM_INFO[id], apiId = API_IDS[id];
  if(!t || !apiId || t._apiLoaded) return;
  showApiStatus('Cargando datos del equipo…');
  let n = 0;
  try { n = await loadPlayerPhotos(id, apiId); }
  catch(e){ console.warn('Cargador:', e); }
  if(n > 0){
    t._apiLoaded = true;
    showApiStatus(`Datos cargados (${n})`);
    hideApiStatus();
    if(currentTeamId === id) openTeam(id);
  } else {
    showApiStatus('La API no devolvió datos');
    hideApiStatus();
  }
}

function showApiStatus(msg){
  let el = document.getElementById('api-status');

    el = document.createElement('div');

    el.style.cssText = 'position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--text1);color:var(--bg2);font-size:11px;padding:5px 14px;border-radius:20px;z-index:100;font-family:var(--sans);opacity:0.85;pointer-events:none;white-space:nowrap;';
    document.getElementById('app').appendChild(el);

  el.style.display = 'block';
}
function hideApiStatus(){
  const el = document.getElementById('api-status');
  if(el) setTimeout(()=>el.style.display='none', 1200);
}

// ── HELPER de un solo uso: descubre los IDs de equipo de API-Football para las
// 48 selecciones con UNA sola llamada (/teams?league=1&season=2026). No se
// ejecuta solo (no gasta cuota en cada carga): se dispara abriendo la app con
// "#discover" al final de la URL (cómodo en móvil) o con discoverApiIds() en
// consola. Vuelca en pantalla y en consola un bloque API_IDS listo para pegar,
// y avisa de conflictos con los IDs actuales y de lo que no consiguió casar.
const API_NAME_ALIASES = {
  usa:['united states','usa'], can:['canada'], mex:['mexico'], uru:['uruguay'],
  arg:['argentina'], bra:['brazil'], esp:['spain'], mar:['morocco'],
  por:['portugal'], fra:['france'], ger:['germany'], sco:['scotland'],
  sui:['switzerland'], bel:['belgium'], eng:['england'], ned:['netherlands','holland'],
  aut:['austria'], tur:['turkey','turkiye'], cro:['croatia'], jpn:['japan'],
  col:['colombia'], ksa:['saudi arabia'], gha:['ghana'],
  kor:['south korea','korea republic','korea'], aus:['australia'], sen:['senegal'],
  ecu:['ecuador'], par:['paraguay'], cdi:['ivory coast','cote divoire'],
  nzl:['new zealand'], ira:['iran'], rsa:['south africa'],
  cze:['czech republic','czechia'], bih:['bosnia and herzegovina','bosnia'],
  qat:['qatar'], hat:['haiti'], cur:['curacao'], tun:['tunisia'], swe:['sweden'],
  cpv:['cape verde','cabo verde'], irq:['iraq'], nor:['norway'], alg:['algeria'],
  jor:['jordan'], cod:['dr congo','congo dr','democratic republic of congo'],
  uzb:['uzbekistan'], pan:['panama'], egy:['egypt']
};

async function discoverApiIds(){
  const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const squash = s => norm(s).replace(/[^a-z]/g,'');
  showApiStatus('Descubriendo IDs (1 llamada)…');
  const data = await apiFetch(`/teams?league=${WC_LEAGUE}&season=${WC_SEASON}`);
  hideApiStatus();
  if(!data || !data.response || !data.response.length){
    const msg = 'La API no devolvió equipos para league=' + WC_LEAGUE + ' season=' + WC_SEASON +
      '.\nPosible causa: la temporada aún no tiene equipos cargados. Reintenta más cerca del 11 de junio.';
    console.warn('discoverApiIds:', msg);
    showDiscoverResult(msg);
    return;
  }
  const apiTeams = data.response.map(r => r.team).filter(Boolean);
  const found = {}, conflicts = [], unmatched = [];
  Object.keys(TEAM_INFO).forEach(code => {
    const aliases = API_NAME_ALIASES[code] || [TEAM_INFO[code].name];
    const hit = apiTeams.find(t => {
      const N = squash(t.name);
      const C = squash(t.code || '');
      if(C && C === code) return true;
      return aliases.some(a => {
        const A = squash(a);
        return A === N || N.includes(A) || A.includes(N);
      });
    });
    if(hit){
      found[code] = hit.id;
      if(API_IDS[code] && API_IDS[code] !== hit.id)
        conflicts.push(code + ': actual ' + API_IDS[code] + ' vs API ' + hit.id + ' (' + hit.name + ')');
    } else {
      unmatched.push(code + ' (' + TEAM_INFO[code].name + ')');
    }
  });
  const order = Object.keys(TEAM_INFO).filter(c => found[c]);
  const block = 'const API_IDS = {\n  ' + order.map(c => c + ':' + found[c]).join(', ') + '\n};';
  let out = block + '\n\nResumen: ' + order.length + '/48 encontrados.';
  if(conflicts.length) out += '\n\nConflictos con IDs actuales (revisar a mano):\n- ' + conflicts.join('\n- ');
  if(unmatched.length) out += '\n\nSin casar (resolver con /teams?search=):\n- ' + unmatched.join('\n- ');
  console.log('\n' + out);
  showDiscoverResult(out);
  return found;
}

function showDiscoverResult(text){
  let o = document.getElementById('discover-overlay');
  if(!o){
    o = document.createElement('div');
    o.id = 'discover-overlay';
    o.style.cssText = 'position:fixed;inset:0;background:var(--bg1);z-index:9999;display:flex;flex-direction:column;padding:14px;box-sizing:border-box;';
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;';
    const title = document.createElement('b');
    title.textContent = 'Descubrir API_IDs';
    title.style.cssText = 'color:var(--text1);font-family:var(--sans);font-size:15px;';
    const close = document.createElement('button');
    close.textContent = 'Cerrar';
    close.style.cssText = 'background:var(--text1);color:var(--bg2);border:0;border-radius:8px;padding:7px 14px;font-family:var(--sans);font-size:13px;';
    close.addEventListener('click', () => o.remove());
    bar.appendChild(title); bar.appendChild(close);
    const ta = document.createElement('textarea');
    ta.id = 'discover-text';
    ta.readOnly = true;
    ta.style.cssText = 'flex:1;width:100%;box-sizing:border-box;font-size:12px;font-family:monospace;white-space:pre;border-radius:8px;padding:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text1);';
    o.appendChild(bar); o.appendChild(ta);
    document.getElementById('app').appendChild(o);
  }
  const ta = document.getElementById('discover-text');
  ta.value = text;
  ta.focus(); ta.select();
}
