<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --gold:       #B8965A;
  --gold-light: #C9A96E;
  --gold-dim:   rgba(184,150,90,0.12);
  --bg1:  #F5F2ED;
  --bg2:  #FDFCFA;
  --bg3:  #EDEAE4;
  --bg4:  #E4E0D8;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.05);
  --text1: #1A1814;
  --text2: #5A5650;
  --text3: #9C968E;
  --serif: 'Libre Baskerville', Georgia, serif;
  --sans:  'DM Sans', sans-serif;
  --tab-h: 64px;
  --r: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg1);
  color: var(--text1);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
}

/* ── SHELL ── */
#app {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg1);
  overflow: hidden;
}

/* ── MASTHEAD ── */
#masthead {
  background: var(--bg2);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.masthead-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 16px 18px 12px;
}
.wordmark {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text1);
  line-height: 1;
}
.wordmark em { color: var(--gold); font-style: normal; }
.masthead-meta {
  font-size: 11px;
  color: var(--text3);
  font-weight: 400;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.gold-rule {
  height: 1.5px;
  background: linear-gradient(90deg, var(--gold) 0%, transparent 80%);
  margin: 0 18px;
}
.search-wrap {
  padding: 10px 18px 12px;
  position: relative;
}
.search-icon {
  position: absolute;
  left: 30px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  stroke: var(--text3);
  pointer-events: none;
}
#search-input {
  width: 100%;
  background: var(--bg1);
  border: 1.5px solid var(--border);
  border-radius: 24px;
  padding: 9px 16px 9px 38px;
  color: var(--text1);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 400;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#search-input::placeholder { color: var(--text3); }
#search-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(184,150,90,0.12);
}

/* ── TABS ── */
#tabs {
  display: flex;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  height: var(--tab-h);
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text3);
  font-size: 12px;
  font-weight: 400;
  position: relative;
  padding-top: 2px;
  user-select: none;
  transition: color 0.2s;
}
.tab::before {
  content: '';
  position: absolute;
  top: 0; left: 24%; right: 24%;
  height: 2px;
  background: var(--gold);
  border-radius: 0 0 2px 2px;
  transform: scaleX(0);
  transition: transform 0.25s cubic-bezier(.4,0,.2,1);
}
.tab.active { color: var(--text1); font-weight: 600; }
.tab.active::before { transform: scaleX(1); }
.tab svg { width: 22px; height: 22px; }

/* ── CONTENT ── */
#content {
  flex: 1;
  overflow: hidden;
  background: var(--bg1);
  display: flex;
  flex-direction: column;
}

/* ── PHASE CHIPS ── */
.phase-bar {
  display: flex;
  gap: 7px;
  padding: 10px 18px;
  overflow-x: auto;
  flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border2);
}
.phase-bar::-webkit-scrollbar { display: none; }
.chip {
  white-space: nowrap;
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 400;
  color: var(--text2);
  cursor: pointer;
  background: transparent;
  font-family: var(--sans);
  transition: all 0.18s;
}
.chip.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold);
  font-weight: 500;
}

/* ── VIEWS ── */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }
.view-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 12px;
}
.view-scroll::-webkit-scrollbar { display: none; }

/* ── DAY HEADER ── */
.day-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 18px 8px;
}
.day-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  white-space: nowrap;
}
.day-rule {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── MATCH ROW ── */
.match-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  padding: 11px 18px 9px;
  gap: 0;
  position: relative;
}
.match-row + .match-row { border-top: 1px solid var(--border2); }
.match-row.highlight { background: rgba(184,150,90,0.06); }

/* home side */
.m-home {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
  min-width: 0;
}
.m-home-info { display: flex; flex-direction: column; min-width: 0; }
.m-team-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.m-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  flex-basis: 100%;
  padding-top: 4px;
}
.m-group {
  font-size: 11px;
  font-weight: 500;
  color: var(--gold);
}
.m-sep { font-size: 10px; color: var(--text3); }
.m-venue { font-size: 11px; color: var(--text3); }

/* center */
.m-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 14px;
  flex-shrink: 0;
}
.m-time {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  color: var(--text2);
  letter-spacing: 0.3px;
}
.m-time.score {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
}
.m-status {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.3px;
}
.m-status.live {
  color: #E03E3E;
  font-weight: 600;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* away side */
.m-away {
  display: flex;
  align-items: center;
  gap: 9px;
  justify-content: flex-end;
  flex: 1;
  min-width: 0;
}
.m-away .m-team-name { text-align: right; }

/* ── FLAG CIRCLE ── */
.fc {
  width: 32px; height: 32px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.fc svg { width: 32px; height: 32px; display: block; }
.fc.lg { width: 40px; height: 40px; }
.fc.lg svg { width: 40px; height: 40px; }
.fc.xl { width: 56px; height: 56px; border-width: 2px; }
.fc.xl svg { width: 56px; height: 56px; }

/* ── TEAMS GRID ── */
.group-section { padding: 0 18px 4px; }
.group-label {
  font-family: var(--serif);
  font-size: 13px;
  font-style: normal;
  color: var(--gold);
  padding: 16px 0 8px;
}
.teams-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.team-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 6px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s;
}
.team-card:active { border-color: var(--gold); background: var(--bg3); }
.team-card .tname {
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  text-align: center;
  line-height: 1.25;
}

/* ── TEAM DETAIL ── */
#team-detail {
  position: absolute;
  inset: 0;
  background: var(--bg1);
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
}
#team-detail.open { transform: translateX(0); }
#team-detail::-webkit-scrollbar { display: none; }

.detail-head {
  background: var(--bg2);
  padding: 16px 18px 18px;
  border-bottom: 1px solid var(--border);
}
.back-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--gold);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 14px;
}
.back-btn svg { width: 16px; height: 16px; stroke: var(--gold); flex-shrink:0; }
.detail-title-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.detail-title-row h2 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--text1);
  line-height: 1.1;
}
.detail-coach { font-size: 12px; color: var(--text3); margin-top: 3px; }
.detail-badge {
  display: inline-block;
  background: var(--gold-dim);
  border: 1px solid rgba(184,150,90,0.4);
  color: var(--gold);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 20px;
  margin-top: 5px;
  letter-spacing: 0.3px;
}
.stats-strip {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.stat-cell {
  flex: 1;
  padding: 14px 0;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat-cell:last-child { border-right: none; }
.stat-n {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  display: block;
}
.stat-l { font-size: 10px; color: var(--text3); letter-spacing: 0.3px; }
.sec-title {
  font-family: var(--serif);
  font-style: normal;
  font-size: 13px;
  color: var(--gold);
  padding: 14px 18px 8px;
}
.match-mini-list { padding: 0 18px; display: flex; flex-direction: column; gap: 7px; margin-bottom: 4px; }
.match-mini {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.match-mini.h { border-color: rgba(184,150,90,0.4); }
.match-mini-teams { font-size: 13px; font-weight: 500; color: var(--text1); }
.match-mini-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
.squad-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  padding: 0 18px 20px;
}
.player-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s, transform 0.12s;
  position: relative;
}
.player-card:active {
  border-color: var(--gold);
  background: var(--bg3);
  transform: scale(0.97);
}
.player-card::after {
  display: none;
}
.player-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--gold);
  overflow: hidden;
  flex-shrink: 0;
}
.player-avatar img { width: 100%; height: 100%; object-fit: cover; }
.p-num { font-family: var(--serif); font-size: 11px; color: var(--gold); font-weight: 700; }
.p-name { font-size: 10px; font-weight: 500; color: var(--text2); text-align: center; line-height: 1.25; }
.p-pos { font-size: 9px; color: var(--text3); }
.p-club { font-size: 9px; color: var(--text3); text-align: center; line-height: 1.2; margin-top: 1px; }

/* ── CALENDAR ── */
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 10px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.cal-nav h2 {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--text1);
  text-transform: capitalize;
}
.cal-nav-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  width: 30px; height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text2);
  transition: background 0.15s;
}
.cal-nav-btn:active { background: var(--bg3); }
.cal-nav-btn svg { width: 14px; height: 14px; stroke: currentColor; }
.cal-grid-wrap { padding: 10px 18px 14px; }
.cal-dow-row {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  margin-bottom: 4px;
}
.cal-dow {
  text-align: center;
  font-size: 10px;
  color: var(--text3);
  font-weight: 500;
  letter-spacing: 0.3px;
  padding: 3px 0;
}
.cal-days {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 2px;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  cursor: pointer;
  color: var(--text3);
  gap: 2px;
  transition: background 0.15s;
}
.cal-day.has-match { color: var(--text2); background: var(--bg3); }
.cal-day.team-match { background: var(--gold-dim) !important; color: var(--gold) !important; font-weight: 600; }
.cal-day.dimmed { opacity: 0.3; }
.cal-day:active { background: var(--bg4); }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0.5; }
.cal-day.team-match .cal-dot { opacity: 1; }
.cal-legend { padding: 0 18px 20px; }
.cal-day-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 14px 0 5px;
}
.cal-legend-title {
  font-family: var(--serif);
  font-style: normal;
  font-size: 13px;
  color: var(--gold);
  padding: 4px 0 10px;
}
.cal-day-group {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 0;
}
.cal-match-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border2);
}
.cal-match-item:last-child { border-bottom: none; }
.cal-match-item.h { background: rgba(184,150,90,0.05); }
.cal-match-item:active { background: var(--bg3); }
.cal-mi-left {}
.cal-mi-teams { font-size: 13px; font-weight: 500; color: var(--text1); }
.cal-mi-time { font-size: 11px; color: var(--text3); margin-top: 1px; }
.cal-mi-right { font-size: 10px; color: var(--text3); }

/* ── DAY MODAL ── */
#day-modal {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 60;
  align-items: flex-end;
  justify-content: center;
}
#day-modal.open { display: flex; }
#day-modal-box {
  background: var(--bg2);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-height: 70vh;
  overflow-y: auto;
  padding: 0 0 24px;
  animation: slideUp 0.25s cubic-bezier(.4,0,.2,1);
}
#day-modal-box::-webkit-scrollbar { display: none; }
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 14px;
}
.modal-day-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 0 18px 10px;
}
.modal-match-row {
  display: flex;
  align-items: center;
  padding: 10px 18px;
  border-top: 1px solid var(--border2);
  gap: 0;
}
.modal-match-row .m-home { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.modal-match-row .m-away { display:flex; align-items:center; gap:8px; justify-content:flex-end; flex:1; min-width:0; }
.modal-match-row .m-away .m-team-name { text-align:right; }
.modal-match-row .m-center { padding: 0 12px; flex-shrink:0; text-align:center; }

/* ── PLAYER SHEET ── */
#player-sheet {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 70;
  align-items: flex-end;
  justify-content: center;
}
#player-sheet.open { display: flex; }
#player-sheet-box {
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 82vh;
  overflow-y: auto;
  padding-bottom: 32px;
  animation: slideUp 0.28s cubic-bezier(.4,0,.2,1);
}
#player-sheet-box::-webkit-scrollbar { display: none; }

.ps-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
}
.ps-hero {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.ps-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--bg3);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  overflow: hidden;
  flex-shrink: 0;
  font-family: var(--serif);
}
.ps-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ps-hero-info { flex: 1; min-width: 0; }
.ps-num {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 4px;
}
.ps-name {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--text1);
  line-height: 1.15;
}
.ps-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-top: 4px;
}
.ps-tag {
  font-size: 11px;
  color: var(--text3);
}
.ps-tag-pos {
  display: inline-block;
  background: var(--gold-dim);
  border: 1px solid rgba(184,150,90,0.35);
  color: var(--gold);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 20px;
}
.ps-club {
  font-size: 12px;
  color: var(--text2);
  font-weight: 500;
  margin-top: 6px;
}
.ps-note {
  font-size: 11px;
  color: var(--text3);
  text-align: center;
  padding: 10px 0 4px;
  letter-spacing: 0.3px;
}
.ps-stats {
  display: flex;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  border-top: 1px solid var(--border);
  margin-top: 0;
}
.ps-stat {
  flex: 1;
  padding: 14px 0;
  text-align: center;
  border-right: 1px solid var(--border);
}
.ps-stat:last-child { border-right: none; }
.ps-stat-n {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  display: block;
}
.ps-stat-l {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.3px;
}
.ps-section {
  font-family: var(--serif);
  font-size: 13px;
  color: var(--gold);
  padding: 14px 20px 8px;
}
.ps-bio-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 20px;
}
.ps-bio-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.ps-bio-label { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
.ps-bio-value { font-size: 13px; font-weight: 500; color: var(--text1); }
.ps-matches {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.ps-match-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ps-match-teams { font-size: 13px; font-weight: 500; color: var(--text1); }
.ps-match-time { font-size: 11px; color: var(--text3); margin-top: 1px; }
.ps-match-right { font-size: 10px; color: var(--text3); }

/* ── EMPTY ── */
.empty-state {
  padding: 48px 20px;
  text-align: center;
  color: var(--text3);
  font-family: var(--sans);
  font-style: normal;
  font-size: 15px;
}
</style>
</head>

<div id="app">

        <circle cx="12" cy="14" r="1.2" fill="currentColor"/>

      </svg>
      Selecciones

  </div>

  <div id="team-detail">
    <div id="team-detail-content"></div>
  </div>

  <div id="day-modal" onclick="closeDayModal()">
    <div id="day-modal-box" onclick="event.stopPropagation()">
      <div id="day-modal-content"></div>
    </div>
  </div>

    <div id="player-sheet-box" onclick="event.stopPropagation()">
      <div id="player-sheet-content"></div>
    </div>
  </div>

</div>

function tname(id){return(TEAM_INFO[id]||{name:id.toUpperCase()}).name;}

function fmtDate(d){
  const dt=new Date(d+'T00:00:00');
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${dias[dt.getDay()].toUpperCase()} ${dt.getDate()} ${meses[dt.getMonth()].toUpperCase()}`;
}

// RENDER MATCHES
// ══════════════════════════════════════
function renderMatches(){
  const ql=q.toLowerCase();
  let ms=MATCHES.filter(m=>{
    if(phase!=='all'&&m.phase!==phase)return false;
    if(ql){const h=tname(m.home).toLowerCase(),a=tname(m.away).toLowerCase();return h.includes(ql)||a.includes(ql);}
    return true;
  });
  const byDate={};
  ms.forEach(m=>{if(!byDate[m.date])byDate[m.date]=[];byDate[m.date].push(m);});
  const dates=Object.keys(byDate).sort();
  const el=document.getElementById('matches-list');
  if(!dates.length){el.innerHTML='<div class="empty-state">Sin partidos para mostrar</div>';return;}
  el.innerHTML=dates.map(date=>{
    const rows=byDate[date];
    return `<div class="day-header"><div class="day-label">${fmtDate(date)}</div><div class="day-rule"></div></div>`+
    rows.map(m=>{
      const hi=ql&&(tname(m.home).toLowerCase().includes(ql)||tname(m.away).toLowerCase().includes(ql));
      return `<div class="match-row${hi?' highlight':''}" onclick="">
        <div class="m-home">
          ${flag(m.home,32)}
          <div class="m-home-info">
            <div class="m-team-name">${tname(m.home)}</div>
          </div>
        </div>
        <div class="m-center">
          <div class="m-time${m.score?' score':''}">${m.score||m.time}</div>
          ${m.scoreLabel?`<div class="m-status${m.scoreLive?' live':''}">${m.scoreLabel}</div>`:''}
        </div>
        <div class="m-away">
          <div class="m-team-name">${tname(m.away)}</div>
          ${flag(m.away,32)}
        </div>
        <div class="m-meta">
          <span class="m-group">Grupo ${m.group}</span>
          <span class="m-sep">·</span>
          <span class="m-venue">${m.venue.split(',')[1]?m.venue.split(',')[1].trim():m.venue}</span>
        </div>
      </div>`;
    }).join('');
  }).join('');
}

// RENDER CALENDAR

function renderCalendar(){
  const yr=calMo.getFullYear(),mo=calMo.getMonth();
  const meses2=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mname=`${meses2[mo]} ${yr}`;
  const first=new Date(yr,mo,1).getDay();
  const days=new Date(yr,mo+1,0).getDate();
  const off=(first===0)?6:first-1;
  const ql=q.toLowerCase();

  const mdays={};
  MATCHES.forEach(m=>{
    const d=new Date(m.date+'T00:00:00');
    if(d.getMonth()===mo&&d.getFullYear()===yr){
      const k=d.getDate();
      if(!mdays[k])mdays[k]=[];
      mdays[k].push(m);
    }
  });

  const teamDays=new Set();
  if(ql){Object.entries(mdays).forEach(([d,ms])=>{ms.forEach(m=>{if(tname(m.home).toLowerCase().includes(ql)||tname(m.away).toLowerCase().includes(ql))teamDays.add(+d);});});}

  const dows=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const legend=Object.entries(mdays).sort((a,b)=>a[0]-b[0]).flatMap(([,ms])=>ms)
    .filter(m=>!ql||(tname(m.home).toLowerCase().includes(ql)||tname(m.away).toLowerCase().includes(ql)));

  document.getElementById('calendar-view').innerHTML=`
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="chMo(-1)"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <h2>${mname}</h2>
      <button class="cal-nav-btn" onclick="chMo(1)"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-dow-row">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
      <div class="cal-days">
        ${Array(off).fill('<div></div>').join('')}
        ${Array.from({length:days},(_,i)=>{
          const d=i+1,has=!!mdays[d],isTeam=teamDays.has(d),dim=ql&&has&&!isTeam;
          let cls='cal-day';if(has)cls+=' has-match';if(isTeam)cls+=' team-match';if(dim)cls+=' dimmed';
          return `<div class="${cls}" onclick="jumpDate('${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}')">${d}${has?'<div class="cal-dot"></div>':''}</div>`;
        }).join('')}
      </div>
    </div>
    <div class="cal-legend">
      ${(()=>{
        const matches = ql ? legend : legend.slice(0,20);
        if(!matches.length) return '<div class="empty-state" style="font-style:normal">Sin partidos este mes</div>';
        const byDay={};
        matches.forEach(m=>{if(!byDay[m.date])byDay[m.date]=[];byDay[m.date].push(m);});
        return Object.keys(byDay).sort().map(date=>{
          const ms=byDay[date];
          const dt=new Date(date+'T00:00:00');
          const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
          const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
          const dayLabel=`${dias[dt.getDay()]} ${dt.getDate()} ${meses[dt.getMonth()]}`;
          return `<div class="cal-day-header">${dayLabel}</div>
            <div class="cal-day-group">`+
            ms.map(m=>{
              const isH=ql&&(tname(m.home).toLowerCase().includes(ql)||tname(m.away).toLowerCase().includes(ql));
              return `<div class="cal-match-item${isH?' h':''}" onclick="jumpDate('${m.date}')">
                <div class="cal-mi-left">
                  <div class="cal-mi-teams">${tname(m.home)} · ${tname(m.away)}</div>
                  <div class="cal-mi-time">${m.time} h · Grupo ${m.group}</div>
                </div>
              </div>`;
            }).join('')+
            `</div>`;
        }).join('');
      })()}
    </div>
  `;
}

  document.getElementById('day-modal').classList.add('open');
}

}

// RENDER TEAMS
// ══════════════════════════════════════
function renderTeams(){
  const ql=q.toLowerCase();
  const groups={};
  Object.entries(TEAM_INFO).forEach(([id,t])=>{
    if(ql&&!t.name.toLowerCase().includes(ql))return;
    if(!groups[t.group])groups[t.group]=[];
    groups[t.group].push({...t,id});
  });
  const el=document.getElementById('teams-list');
  const keys=Object.keys(groups).sort();
  if(!keys.length){el.innerHTML='<div class="empty-state">Sin resultados</div>';return;}
  el.innerHTML=keys.map(g=>`
    <div class="group-section">
      <div class="group-label">Grupo ${g}</div>
      <div class="teams-grid">
        ${groups[g].map(t=>`<div class="team-card" onclick="openTeam('${t.id}')">
          ${flag(t.id,40)}
          <div class="tname">${t.name}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

function openPlayerSheet(teamId, playerIdx){
  const t = TEAM_INFO[teamId] || {};
  const sq = t.squad || [];
  const p = sq[playerIdx];
  if(!p) return;

  const teamMatches = MATCHES.filter(m => m.home===teamId || m.away===teamId);
  const initials = p.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  const avatarHTML = p.photo
    ? `<img src="${p.photo}" onerror="this.parentElement.textContent='${initials}'">`
    : initials;

  // Bio data — placeholder until API
  const posLabel = {PO:'Portero', DEF:'Defensa', MED:'Centrocampista', DEL:'Delantero'}[p.pos] || p.pos;

  document.getElementById('player-sheet-content').innerHTML = `
    <div class="ps-handle"></div>
    <div class="ps-hero">
      <div class="ps-avatar">${avatarHTML}</div>
      <div class="ps-hero-info">
        <div class="ps-num">${p.n}</div>
        <div class="ps-name">${p.name}</div>
        <div class="ps-meta" style="margin-top:6px; gap:6px;">
          <span class="ps-tag-pos">${posLabel}</span>
        </div>
        ${p.club ? `<div class="ps-club">· ${p.club} ·</div>` : ''}
      </div>
    </div>

    <div class="ps-stats">
      <div class="ps-stat"><span class="ps-stat-n">0</span><span class="ps-stat-l">goles</span></div>
      <div class="ps-stat"><span class="ps-stat-n">0</span><span class="ps-stat-l">asistencias</span></div>
      <div class="ps-stat"><span class="ps-stat-n">0'</span><span class="ps-stat-l">minutos</span></div>
      <div class="ps-stat"><span class="ps-stat-n">0</span><span class="ps-stat-l">tarjetas</span></div>
    </div>

    <div class="ps-note">Estadísticas del Mundial 2026</div>

    <div style="height:8px"></div>
  `;

  // Swipe down to close
  const box = document.getElementById('player-sheet-box');
  let startY = 0;
  box.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
  box.addEventListener('touchend', e => { if(e.changedTouches[0].clientY - startY > 60) closePlayerSheet(); }, {passive:true});

  document.getElementById('player-sheet').classList.add('open');
}

}

// ══════════════════════════════════════
// API-FOOTBALL
// ══════════════════════════════════════
const API_KEY = '31d66c2cbb8035670e626538f5213c41';
const API_BASE = 'https://v3.football.api-sports.io';
const WC_LEAGUE = 1;
const WC_SEASON = 2026;
let liveRefreshTimer = null;

async function apiFetch(endpoint){
  try {
    const r = await fetch(`${API_BASE}${endpoint}`, {
      headers: { 'x-apisports-key': API_KEY }
    });
    return await r.json();
  } catch(e) { console.warn('API error:', e); return null; }
}

async function loadFixtures(){
  showApiStatus('Actualizando resultados…');
  const data = await apiFetch(`/fixtures?league=${WC_LEAGUE}&season=${WC_SEASON}`);
  if(!data || !data.response){ hideApiStatus(); return; }

  data.response.forEach(f => {
    const home = f.teams.home.name.toLowerCase();
    const away = f.teams.away.name.toLowerCase();
    const date = f.fixture.date?.substring(0,10);
    const status = f.fixture.status.short;
    const elapsed = f.fixture.status.elapsed;

    // Match to local by team name or date+time proximity
    const match = MATCHES.find(m => {
      const mh = tname(m.home).toLowerCase();
      const ma = tname(m.away).toLowerCase();
      return (mh === home || mh.includes(home.split(' ')[0])) &&
             (ma === away || ma.includes(away.split(' ')[0]));
    }) || MATCHES.find(m => m.date === date);

    if(!match) return;

    match.fixtureId = f.fixture.id;
    match.status = status;

    const liveStatuses = ['1H','2H','HT','ET','P','BT'];
    const finishedStatuses = ['FT','AET','PEN'];

    if([...liveStatuses, ...finishedStatuses].includes(status)){
      const h = f.goals.home ?? 0;
      const a = f.goals.away ?? 0;
      match.score = `${h}—${a}`;
      match.scoreLive = liveStatuses.includes(status);
      match.scoreLabel = status === 'HT' ? 'Descanso' :
                         finishedStatuses.includes(status) ? 'Final' :
                         `${elapsed}'`;
    } else {
      match.score = null;
      match.scoreLive = false;
      match.scoreLabel = null;
    }
  });

  hideApiStatus();
  render();

  // Auto-refresh if live matches
  clearTimeout(liveRefreshTimer);
  if(MATCHES.some(m => m.scoreLive)){
    liveRefreshTimer = setTimeout(loadFixtures, 60000);
  }
}

async function loadPlayerPhotos(teamLocalId, teamApiId){
  if(!teamApiId) return;
  const data = await apiFetch(`/players?team=${teamApiId}&season=${WC_SEASON}&league=${WC_LEAGUE}`);
  if(!data || !data.response) return;
  const team = TEAM_INFO[teamLocalId];
  if(!team || !team.squad) return;
  data.response.forEach(p => {
    const apiName = p.player.name.toLowerCase();
    const local = team.squad.find(s =>
      s.name.toLowerCase().split(' ').some(w => w.length > 3 && apiName.includes(w))
    );
    if(local){
      local.photo = p.player.photo;
      local.age = p.player.age;
      local.height = p.player.height;
    }
  });
}

function showApiStatus(msg){
  let el = document.getElementById('api-status');
  if(!el){
    el = document.createElement('div');
    el.id = 'api-status';
    el.style.cssText = 'position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--text1);color:var(--bg2);font-size:11px;padding:5px 14px;border-radius:20px;z-index:100;font-family:var(--sans);opacity:0.85;pointer-events:none;white-space:nowrap;';
    document.getElementById('app').appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
}
function hideApiStatus(){
  const el = document.getElementById('api-status');
  if(el) setTimeout(()=>el.style.display='none', 1200);
}

render();
loadFixtures();
setInterval(loadFixtures, 300000); // refresh every 5min passively
