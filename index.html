<style>
:root {
  --gold:       #B8965A;
  --gold-light: #C9A96E;
  --gold-dim:   rgba(184,150,90,0.12);
  --bg1:  #F5F2ED;
  --bg2:  #FDFCFA;
  --bg3:  #EDEAE4;
  --bg4:  #E4E0D8;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.05);
  --text1: #1A1814;
  --text2: #5A5650;
  --text3: #9C968E;
  --serif: 'Libre Baskerville', Georgia, serif;
  --sans:  'DM Sans', sans-serif;
  --tab-h: 80px;
  --r: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg1);
  color: var(--text1);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
}

/* ── SHELL ── */
#app {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg1);
  overflow: hidden;
}

/* ── MASTHEAD ── */
#masthead {
  background: var(--bg2);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.masthead-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 16px 20px 12px;
}
.wordmark {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text1);
  line-height: 1;
}
.wordmark em { color: var(--gold); font-style: normal; }
.masthead-meta {
  font-size: 11px;
  color: var(--text3);
  font-weight: 400;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.gold-rule {
  height: 1.5px;
  background: linear-gradient(90deg, var(--gold) 0%, transparent 80%);
  margin: 0 20px;
}
.search-wrap {
  padding: 10px 20px 12px;
  position: relative;
}
.search-icon {
  position: absolute;
  left: 30px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  stroke: var(--text3);
  pointer-events: none;
}
#search-input {
  width: 100%;
  background: var(--bg1);
  border: 1.5px solid var(--border);
  border-radius: 24px;
  padding: 9px 40px 9px 38px;
  color: var(--text1);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 400;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#search-input::placeholder { color: var(--text3); }
#search-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(184,150,90,0.12);
}
#search-input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none;}
.search-clear{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:var(--bg3);border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.search-clear.show{display:flex;}
.search-clear svg{width:12px;height:12px;stroke:var(--text2);stroke-width:2.5;fill:none;}
.sr-sec-title{font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.02em;margin:16px 4px 8px;}
.sr-sec:first-child .sr-sec-title{margin-top:6px;}
.sr-list{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.sr-club-grp+.sr-club-grp{margin-top:10px;}
.sr-row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;}
.sr-row+.sr-row,.sr-club-head+.sr-row{border-top:.5px solid var(--border);}
.sr-row:active{background:var(--bg1);}
.sr-info{min-width:0;flex:1;}
.sr-nm{font-size:14px;font-weight:500;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-meta{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-chev{width:16px;height:16px;flex:none;stroke:var(--text3);stroke-width:2;fill:none;}
.sr-club-head{display:flex;align-items:baseline;gap:7px;padding:8px 12px;background:rgba(184,150,90,0.12);}
.sr-club-head .cn{font-size:13px;font-weight:600;color:#8A6E3E;}
.sr-club-head .cc{font-size:11px;color:#A79574;}
.sr-more{padding:8px 12px;font-size:11px;color:var(--text3);border-top:.5px solid var(--border);}

/* ── TABS ── */
#tabs {
  display: flex;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  height: var(--tab-h);
  padding-bottom: 16px;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text3);
  font-size: 12px;
  font-weight: 400;
  position: relative;
  padding-top: 2px;
  user-select: none;
  transition: color 0.2s;
}
.tab::before {
  content: '';
  position: absolute;
  top: 0; left: 24%; right: 24%;
  height: 2px;
  background: var(--gold);
  border-radius: 0 0 2px 2px;
  transform: scaleX(0);
  transition: transform 0.25s cubic-bezier(.4,0,.2,1);
}
.tab.active { color: var(--text1); font-weight: 600; }
.tab.active::before { transform: scaleX(1); }
.tab svg { width: 22px; height: 22px; }

/* ── CONTENT ── */
#content {
  flex: 1;
  overflow: hidden;
  background: var(--bg1);
  display: flex;
  flex-direction: column;
}

/* ── PHASE CHIPS ── */
.phase-bar {
  display: flex;
  gap: 7px;
  padding: 10px 20px;
  overflow-x: auto;
  flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border2);
}
.phase-bar::-webkit-scrollbar { display: none; }
.chip {
  white-space: nowrap;
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 400;
  color: var(--text2);
  cursor: pointer;
  background: transparent;
  font-family: var(--sans);
  transition: all 0.18s;
}
.chip.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold);
  font-weight: 500;
}

/* ── VIEWS ── */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }
.view-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 12px;
}
.view-scroll::-webkit-scrollbar { display: none; }

/* ── DAY HEADER ── */
.day-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 20px 8px;
}
.day-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  white-space: nowrap;
}
.day-rule {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.group-teams-strip {
  font-size: 11px;
  color: var(--text3);
  padding: 4px 20px 10px;
  letter-spacing: 0.2px;
}

/* ── MATCH ROW ── */
.match-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  padding: 11px 20px 9px;
  gap: 0;
  position: relative;
}
.match-row + .match-row { border-top: 1px solid var(--border2); }
.match-row.highlight { background: rgba(184,150,90,0.06); }

/* home side */
.m-home {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
  min-width: 0;
}
.m-home-info { display: flex; flex-direction: column; min-width: 0; }
.m-team-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.m-team-name.ko {
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  line-height: 1.2;
  font-size: 12.5px;
}
.m-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  flex-basis: 100%;
  padding-top: 4px;
}
.m-group {
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
}
.m-date { font-size: 11px; font-weight: 500; color: var(--gold); }
.m-num { font-size: 11px; font-weight: 500; color: var(--gold); }
.m-sep { font-size: 10px; color: var(--text3); }
.m-venue { font-size: 11px; color: var(--text3); }

/* center */
.m-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 14px;
  flex-shrink: 0;
}
.m-time {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  color: var(--text2);
  letter-spacing: 0.3px;
}
.m-time.score {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
}
.m-status {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.3px;
}
.m-status.live {
  color: #E03E3E;
  font-weight: 600;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* away side */
.m-away {
  display: flex;
  align-items: center;
  gap: 9px;
  justify-content: flex-end;
  flex: 1;
  min-width: 0;
}
.m-away .m-team-name { text-align: right; }

/* ── FLAG CIRCLE ── */
.fc {
  width: 32px; height: 32px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.fc .fi {
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  border-radius: 50%;
  display: block;
}
.fc svg { width: 32px; height: 32px; display: block; }
.fc.lg { width: 40px; height: 40px; }
.fc.lg svg { width: 40px; height: 40px; }
.fc.xl { width: 56px; height: 56px; border-width: 2px; }
.fc.xl svg { width: 56px; height: 56px; }

/* ── TEAMS GRID ── */
.group-section { padding: 0 18px 4px; }
.group-label {
  font-family: var(--serif);
  font-size: 13px;
  font-style: normal;
  color: var(--gold);
  padding: 16px 0 8px;
}
.teams-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.team-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 6px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s;
}
.team-card:active { border-color: var(--gold); background: var(--bg3); }
.team-card .tname {
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  text-align: center;
  line-height: 1.25;
}

/* ── TEAM DETAIL ── */
#team-detail {
  position: absolute;
  inset: 0;
  background: var(--bg1);
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
}
#team-detail.open { transform: translateX(0); }
#team-detail::-webkit-scrollbar { display: none; }

#match-detail {
  position: absolute;
  inset: 0;
  background: var(--bg1);
  z-index: 55;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
}
#match-detail.open { transform: translateX(0); }
#match-detail::-webkit-scrollbar { display: none; }
.lu-score { text-align:center; padding:4px 0 2px; }
.lu-score-n { font-family:var(--serif); font-size:26px; color:var(--text1); }
.lu-score-l { font-size:11px; color:var(--text2); margin-top:2px; }
.lu-score-l.live { color:#C0392B; font-weight:600; }
.lu-head { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; margin-top:8px; }
.lu-team { display:flex; align-items:center; gap:8px; justify-content:center; }
.lu-team .nm2 { font-family:var(--sans); font-weight:500; font-size:14px; color:var(--text1); white-space:nowrap; }
.lu-sc-n { font-family:var(--serif); font-size:19px; color:var(--text1); line-height:1; text-align:center; white-space:nowrap; }
.lu-sc-l { font-size:11px; color:var(--text2); margin-top:6px; text-align:center; }
.lu-sc-l.live { color:#C0392B; font-weight:600; }
.lu-goals { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.lu-gl { font-size:12px; color:var(--text2); display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-top:5px; }
.lu-gl .mn { color:var(--text3); font-variant-numeric:tabular-nums; }
.pl .av .cap { position:absolute; left:-5px; top:-5px; min-width:15px; height:15px; padding:0 2px; border-radius:8px; background:var(--text1); color:#fff; font-size:9px; font-weight:600; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--bg1); }
.lu-toggle { display:flex; gap:24px; justify-content:center; margin-top:14px; }
.lu-tab { color:var(--text3); font-size:14px; font-weight:500; cursor:pointer; padding-bottom:5px; }
.lu-tab.active { color:var(--text1); border-bottom:2px solid var(--gold); }
.lu-form { text-align:center; font-size:11px; letter-spacing:.08em; color:var(--gold); font-weight:600; margin:14px 0 10px; }
.pitch { position:relative; height:430px; margin:0 14px; background:var(--bg3); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
.pl { position:absolute; transform:translate(-50%,-50%); width:62px; text-align:center; }
.pl .av { width:42px; height:42px; border-radius:50%; background:var(--bg2); border:1.5px solid var(--gold); margin:0 auto; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:13px; color:var(--text1); position:relative; }
.pl .av img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%; }
.pl .num { position:absolute; right:-5px; bottom:-5px; min-width:17px; height:17px; padding:0 3px; border-radius:9px; background:var(--gold); color:#fff; font-size:10.5px; font-weight:600; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--bg1); }
.pl .nm { margin-top:4px; font-size:11px; color:var(--text2); white-space:nowrap; font-weight:500; overflow:hidden; text-overflow:ellipsis; }
.lu-bench-h { font-size:11px; letter-spacing:.08em; color:var(--text3); text-transform:uppercase; margin:18px 18px 8px; }
.lu-chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 18px; }
.lu-chip { font-size:11.5px; color:var(--text2); background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:4px 9px; display:inline-flex; align-items:center; }
.lu-chip b { color:var(--gold); font-weight:600; }
.pl .subout { position:absolute; right:-5px; top:-5px; width:16px; height:16px; border-radius:50%; background:#C0392B; border:1.5px solid var(--bg1); display:flex; align-items:center; justify-content:center; }
.pl .subout svg { width:9px; height:9px; display:block; }
.lu-chip .subin { display:inline-flex; align-items:center; vertical-align:middle; margin-right:4px; }
.lu-chip .subin svg { width:10px; height:10px; display:block; }
.lu-chip.entered { border-color:rgba(46,125,50,.4); }
.lu-coach { margin:11px 18px 24px; font-size:11.5px; color:var(--text3); }

.detail-head {
  background: var(--bg2);
  padding: 16px 18px 18px;
  border-bottom: 1px solid var(--border);
}
.back-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--gold);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 14px;
}
.back-btn svg { width: 16px; height: 16px; stroke: var(--gold); flex-shrink:0; }
.detail-title-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.detail-title-row h2 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--text1);
  line-height: 1.1;
}
.detail-coach { font-size: 12px; color: var(--text3); margin-top: 3px; }
.detail-badge {
  display: inline-block;
  background: var(--gold-dim);
  border: 1px solid rgba(184,150,90,0.4);
  color: var(--gold);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 20px;
  margin-top: 5px;
  letter-spacing: 0.3px;
}
.stats-strip {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.stat-cell {
  flex: 1;
  padding: 14px 0;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat-cell:last-child { border-right: none; }
.stat-n {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  display: block;
}
.stat-l { font-size: 10px; color: var(--text3); letter-spacing: 0.3px; }
.sec-title {
  font-family: var(--serif);
  font-style: normal;
  font-size: 13px;
  color: var(--gold);
  padding: 14px 18px 8px;
}
.match-mini-list { padding: 0 18px; display: flex; flex-direction: column; gap: 7px; margin-bottom: 4px; }
.match-mini {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.match-mini.h { border-color: rgba(184,150,90,0.4); }
.match-mini-teams { font-size: 13px; font-weight: 500; color: var(--text1); }
.match-mini-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
.squad-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 8px;
  padding: 0 18px 20px;
}
.player-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s, transform 0.12s;
  position: relative;
}
.player-card:active {
  border-color: var(--gold);
  background: var(--bg3);
  transform: scale(0.97);
}
.player-card::after {
  display: none;
}
.player-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--gold);
  overflow: hidden;
  flex-shrink: 0;
}
.player-avatar img { width: 100%; height: 100%; object-fit: cover; }
.p-num { font-family: var(--serif); font-size: 11px; color: var(--gold); font-weight: 700; }
.p-name { font-size: 11px; font-weight: 500; color: var(--text2); text-align: center; line-height: 1.25; }
.p-pos { font-size: 9px; color: var(--text3); }
.p-club { font-size: 10px; color: var(--text3); text-align: center; line-height: 1.2; margin-top: 1px; }

/* ── CALENDAR ── */
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 10px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.cal-nav h2 {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--text1);
  text-transform: capitalize;
}
.cal-nav-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  width: 30px; height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text2);
  transition: background 0.15s;
}
.cal-nav-btn:active { background: var(--bg3); }
.cal-nav-btn svg { width: 14px; height: 14px; stroke: currentColor; }
.cal-grid-wrap { padding: 10px 18px 14px; }
.cal-dow-row {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  margin-bottom: 4px;
}
.cal-dow {
  text-align: center;
  font-size: 10px;
  color: var(--text3);
  font-weight: 500;
  letter-spacing: 0.3px;
  padding: 3px 0;
}
.cal-days {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 2px;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text2);
  gap: 2px;
  transition: background 0.15s;
}
.cal-day.has-match { color: var(--text2); background: var(--bg3); }
.cal-day.team-match { background: var(--gold-dim) !important; color: var(--gold) !important; font-weight: 600; }
.cal-day.dimmed { opacity: 0.3; }
.cal-day:active { background: var(--bg4); }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0.5; }
.cal-day.team-match .cal-dot { opacity: 1; }
.cal-legend { padding: 0 18px 20px; }
.cal-day-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 14px 0 5px;
}
.cal-legend-title {
  font-family: var(--serif);
  font-style: normal;
  font-size: 13px;
  color: var(--gold);
  padding: 4px 0 10px;
}
.cal-day-group {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 0;
}
.cal-match-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border2);
}
.cal-match-item:last-child { border-bottom: none; }
.cal-match-item.h { background: rgba(184,150,90,0.05); }
.cal-match-item:active { background: var(--bg3); }
.cal-mi-left {}
.cal-mi-teams { font-size: 13px; font-weight: 500; color: var(--text1); }
.cal-mi-time { font-size: 11px; color: var(--text3); margin-top: 1px; }
.cal-mi-right { font-size: 10px; color: var(--text3); }

/* ── DAY MODAL ── */
#day-modal {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 60;
  align-items: flex-end;
  justify-content: center;
}
#day-modal.open { display: flex; }
#day-modal-box {
  background: var(--bg2);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-height: 70vh;
  overflow-y: auto;
  padding: 0 0 24px;
  animation: slideUp 0.25s cubic-bezier(.4,0,.2,1);
}
#day-modal-box::-webkit-scrollbar { display: none; }
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 14px;
}
.modal-day-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 0 18px 10px;
}
.modal-match-row {
  display: flex;
  align-items: center;
  padding: 10px 18px;
  border-top: 1px solid var(--border2);
  gap: 0;
}
.modal-match-row .m-home { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.modal-match-row .m-away { display:flex; align-items:center; gap:8px; justify-content:flex-end; flex:1; min-width:0; }
.modal-match-row .m-away .m-team-name { text-align:right; }
.modal-match-row .m-center { padding: 0 12px; flex-shrink:0; text-align:center; }

/* ── PLAYER SHEET ── */
#player-sheet {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 70;
  align-items: flex-end;
  justify-content: center;
}
#player-sheet.open { display: flex; }
#player-sheet-box {
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 82vh;
  overflow-y: auto;
  padding-bottom: 32px;
  animation: slideUp 0.28s cubic-bezier(.4,0,.2,1);
}
#player-sheet-box::-webkit-scrollbar { display: none; }

.ps-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
}
.ps-hero {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.ps-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--bg3);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  overflow: hidden;
  flex-shrink: 0;
  font-family: var(--serif);
}
.ps-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ps-hero-info { flex: 1; min-width: 0; }
.ps-num {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 4px;
}
.ps-name {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--text1);
  line-height: 1.15;
}
.ps-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-top: 4px;
}
.ps-tag {
  font-size: 11px;
  color: var(--text3);
}
.ps-tag-pos {
  display: inline-block;
  background: var(--gold-dim);
  border: 1px solid rgba(184,150,90,0.35);
  color: var(--gold);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 20px;
}
.ps-club {
  font-size: 12px;
  color: var(--text2);
  font-weight: 500;
  margin-top: 6px;
}
.ps-note {
  font-size: 11px;
  color: var(--text3);
  text-align: center;
  padding: 10px 0 4px;
  letter-spacing: 0.3px;
}
.ps-stats {
  display: flex;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  border-top: 1px solid var(--border);
  margin-top: 0;
}
.ps-stat {
  flex: 1;
  padding: 14px 0;
  text-align: center;
  border-right: 1px solid var(--border);
}
.ps-stat:last-child { border-right: none; }
.ps-stat-n {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  display: block;
}
.ps-stat-l {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.3px;
}
.ps-section {
  font-family: var(--serif);
  font-size: 13px;
  color: var(--gold);
  padding: 14px 20px 8px;
}
.ps-bio-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 20px;
}
.ps-bio-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.ps-bio-label { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
.ps-bio-value { font-size: 13px; font-weight: 500; color: var(--text1); }
.ps-matches {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.ps-match-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ps-match-teams { font-size: 13px; font-weight: 500; color: var(--text1); }
.ps-match-time { font-size: 11px; color: var(--text3); margin-top: 1px; }
.ps-match-right { font-size: 10px; color: var(--text3); }

/* ── EMPTY ── */
.empty-state {
  padding: 48px 20px;
  text-align: center;
  color: var(--text3);
  font-family: var(--sans);
  font-style: normal;
  font-size: 15px;
}
/* ── TU MUNDIAL (simulador) ── */
.tm-wrap{padding:16px 16px 32px;}
.tm-intro{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:22px 18px;text-align:center;margin-top:8px;}
.tm-intro h2{font-family:var(--serif);font-size:20px;margin:0 0 6px;}
.tm-intro p{font-size:13px;color:var(--text2);line-height:1.5;margin:0 0 6px;}
.tm-prog{display:flex;align-items:center;gap:8px;margin:2px 2px 14px;}
.tm-prog .lbl{font-size:11px;color:var(--text3);white-space:nowrap;letter-spacing:.04em;}
.tm-prog .bar{flex:1;height:5px;border-radius:3px;background:var(--bg4);overflow:hidden;}
.tm-prog .bar span{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .25s;}
.tm-title{font-family:var(--serif);font-size:18px;margin:2px 2px 4px;}
.tm-title .c{font-family:var(--sans);font-size:10px;color:var(--gold);background:var(--gold-dim);border-radius:20px;padding:3px 9px;font-weight:600;margin-left:8px;vertical-align:middle;white-space:nowrap;}
.tm-hint{font-size:11.5px;color:var(--text3);margin:6px 2px 14px;}
.tm-subh{font-family:var(--serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);margin:16px 2px 8px;}
.tm-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.tm-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--border2);}
.tm-row:last-child{border-bottom:0;}
.tm-pos{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--bg3);color:var(--text2);}
.tm-row.q1 .tm-pos,.tm-row.q2 .tm-pos{background:var(--gold);color:#fff;}
.tm-row.q3 .tm-pos{background:var(--gold-dim);color:var(--gold);}
.tm-row.q4{opacity:.5;}
.tm-nm{flex:1;font-size:14px;font-weight:500;}
.tm-tag{font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:20px;font-weight:600;}
.tm-tag.ok{background:rgba(63,125,90,.12);color:#3F7D5A;}
.tm-tag.rep{background:var(--gold-dim);color:var(--gold);}
.tm-tag.out{background:rgba(0,0,0,.05);color:var(--text3);}
.tm-arrows{display:flex;flex-direction:column;gap:1px;margin-left:2px;}
.tm-arrows button{width:28px;height:18px;border:0;background:transparent;color:var(--text3);cursor:pointer;font-size:11px;line-height:1;padding:0;}
.tm-arrows button:disabled{opacity:.25;}
.tm-thirds{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:4px;}
.tm-chip{display:flex;align-items:center;gap:9px;padding:9px 10px;min-height:60px;box-sizing:border-box;border-radius:11px;border:1px solid var(--border);background:var(--bg2);font-size:12.5px;cursor:pointer;transition:all .15s;}
.tm-chip .cn{flex:1;font-weight:500;line-height:1.15;}
.tm-chip .gr{font-size:9.5px;color:var(--text3);}
.tm-chip.sel{border-color:var(--gold);background:var(--gold-dim);}
.tm-chip .mk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;}
.tm-chip.sel .mk{background:var(--gold);border-color:var(--gold);position:relative;}
.tm-chip.sel .mk::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
.tm-counter{font-size:12px;color:var(--text2);text-align:center;margin:13px 0 2px;}
.tm-counter b{color:var(--gold);}
.tm-tie{background:var(--bg2);border:1.5px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:13px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative;}
.tm-vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg1);border:1px solid var(--border);color:var(--text3);font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:20px;z-index:2;}
.tm-team{display:flex;align-items:center;gap:10px;padding:9px 11px;cursor:pointer;transition:background .15s;}
.tm-team+.tm-team{border-top:1px solid var(--border2);}
.tm-team .tn{flex:1;font-size:13.5px;font-weight:500;}
.tm-team .pk{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;}
.tm-team.win{background:var(--gold-dim);}
.tm-team.win .tn{font-weight:700;}
.tm-team.win .pk{background:var(--gold);border-color:var(--gold);position:relative;}
.tm-team.win .pk::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;}
.tm-team.tbd{opacity:.45;cursor:default;}
.tm-champ{margin-top:16px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:var(--r);padding:18px;text-align:center;color:#fff;box-shadow:0 8px 20px rgba(184,150,90,.35);}
.tm-champ .k{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;}
.tm-champ .r2{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
.tm-champ .nm2{font-family:var(--serif);font-size:20px;font-weight:700;}
.tm-btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:var(--r);background:var(--text1);color:var(--bg2);font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.02em;cursor:pointer;}
.tm-btn:disabled{opacity:.4;}
.tm-btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.tm-btn.soft{background:var(--gold-dim);color:var(--gold);}
.tm-nav{display:flex;gap:8px;margin-top:14px;}
.tm-nav .tm-btn{margin-top:0;}
.tm-nav .back{flex:0 0 46px;background:transparent;border:1px solid var(--border);color:var(--text2);}
/* Tarjeta para compartir (imagen) */
.tm-shot{width:360px;box-sizing:border-box;border:1.5px solid rgba(184,150,90,.45);border-radius:14px;background:radial-gradient(120% 60% at 50% 0%, rgba(184,150,90,.14), transparent 60%), var(--bg2);}
.tm-shot-in{padding:22px 22px 18px;}
.ss-kick{text-align:center;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;}
.ss-title{text-align:center;font-family:var(--serif);font-size:23px;margin:4px 0 0;}
.ss-title i{color:var(--gold);font-style:normal;}
.ss-crule{width:34px;height:2px;background:var(--gold);border-radius:2px;margin:7px auto 0;}
.ss-hero{margin:14px 0 6px;text-align:center;}
.ss-crown{color:var(--gold);display:block;margin:0 auto;}
.ss-medal{display:inline-block;border-radius:50%;box-shadow:0 0 0 4px var(--gold-dim);margin-top:2px;}
.ss-medal .fc{border-color:var(--gold)!important;border-width:2.5px!important;}
.ss-clbl{margin-top:10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);}
.ss-cnm{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:2px;}
.ss-div{display:flex;align-items:center;gap:10px;margin:18px 4px 14px;}
.ss-div .ln{flex:1;height:1px;background:var(--border);}
.ss-div .t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
.ss-final{display:flex;align-items:center;justify-content:center;gap:14px;}
.ss-side{display:flex;flex-direction:column;align-items:center;gap:6px;width:108px;}
.ss-side .nm{font-size:13px;font-weight:600;text-align:center;line-height:1.1;}
.ss-vs{font-family:var(--serif);font-size:13px;color:var(--gold);font-style:normal;}
.ss-semis{display:flex;justify-content:center;gap:14px;}
.ss-s{display:flex;flex-direction:column;align-items:center;gap:4px;}
.ss-s .c{font-size:9px;color:var(--text2);font-weight:600;letter-spacing:.03em;}
.ss-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:2px;}
.ss-wm{font-family:var(--serif);font-size:13px;color:var(--text1);}
.ss-wm em{color:var(--gold);font-style:normal;}
.ss-foot .site{font-size:11px;color:var(--text3);letter-spacing:.03em;}
</style>
</head>
<body>
<div id="app">

  <!-- MASTHEAD -->
  <div id="masthead">
    <div class="masthead-top">
      <div class="wordmark">Mundial <em>2026</em></div>
      <div class="masthead-meta">EE.UU. · Canadá · Méx.</div>
    </div>
    <div class="gold-rule"></div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>
      </svg>
      <input id="search-input" type="search" placeholder="Buscar selección…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="search-clear" class="search-clear" type="button" aria-label="Limpiar búsqueda" onclick="clearSearch()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">

    <!-- PARTIDOS -->
    <div id="view-matches" class="view active">
      <div class="phase-bar" id="phase-bar">
        <div class="chip active" data-phase="all">Todos</div>
        <div class="chip" data-phase="groups">Fase de grupos</div>
        <div class="chip" data-phase="r32">Dieciseisavos</div>
        <div class="chip" data-phase="r16">Octavos</div>
        <div class="chip" data-phase="qf">Cuartos</div>
        <div class="chip" data-phase="sf">Semifinales</div>
        <div class="chip" data-phase="final">Final</div>
      </div>
      <div class="view-scroll" id="matches-list"></div>
    </div>

    <!-- CALENDARIO -->
    <div id="view-calendar" class="view">
      <div class="view-scroll" id="calendar-view"></div>
    </div>

    <!-- SELECCIONES -->
    <div id="view-teams" class="view">
      <div class="view-scroll" id="teams-list"></div>
    </div>

    <!-- TU MUNDIAL -->
    <div id="view-tumundial" class="view">
      <div class="view-scroll" id="tm-view"></div>
    </div>

  </div>

  <!-- TABS -->
  <div id="tabs">
    <div class="tab active" data-view="matches">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="4" height="4" rx="1"/><rect x="3" y="13" width="4" height="4" rx="1"/>
        <line x1="10" y1="7" x2="21" y2="7"/><line x1="10" y1="15" x2="21" y2="15"/>
      </svg>
      Partidos
    </div>
    <div class="tab" data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2.5"/>
        <path d="M3 9h18"/><path d="M8 2v3M16 2v3"/>
        <circle cx="12" cy="14" r="1.2" fill="currentColor"/>
      </svg>
      Calendario
    </div>

function flag(id, sz) {
  sz = sz || 32;
  const s = `width:${sz}px;height:${sz}px;`;
  const cls = `fc${sz===40?' lg':sz===56?' xl':''}`;
  const iso = {'usa':'us', 'can':'ca', 'mex':'mx', 'uru':'uy', 'arg':'ar', 'bra':'br', 'esp':'es', 'mar':'ma', 'por':'pt', 'fra':'fr', 'ger':'de', 'sco':'gb-sct', 'sui':'ch', 'bel':'be', 'eng':'gb-eng', 'ned':'nl', 'aut':'at', 'tur':'tr', 'cro':'hr', 'jpn':'jp', 'col':'co', 'ksa':'sa', 'gha':'gh', 'kor':'kr', 'aus':'au', 'sen':'sn', 'ecu':'ec', 'par':'py', 'cdi':'ci', 'nzl':'nz', 'ira':'ir', 'rsa':'za', 'cze':'cz', 'bih':'ba', 'qat':'qa', 'hat':'ht', 'cur':'cw', 'tun':'tn', 'swe':'se', 'cpv':'cv', 'irq':'iq', 'nor':'no', 'alg':'dz', 'jor':'jo', 'cod':'cd', 'uzb':'uz', 'pan':'pa', 'egy':'eg'};
  const code = iso[id];
  if (code) {
    return `<div class="${cls}" style="${s}"><span class="fi fi-${code} fis" style="width:${sz}px;height:${sz}px;background-size:cover;"></span></div>`;
  }
  // Fallback initials
  const colors=['#2563EB','#DC2626','#16A34A','#D97706','#7C3AED','#0891B2'];
  const h=id.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const bc=colors[h%colors.length];
  const lt=id.substring(0,2).toUpperCase();
  return `<div class="${cls}" style="${s}"><svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="fcc${id}${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${sz/2}"/></clipPath></defs><g clip-path="url(#fcc${id}${sz})"><rect width="${sz}" height="${sz}" fill="${bc}"/><text x="${sz/2}" y="${sz/2+4}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${sz*0.35}" font-weight="700" fill="rgba(255,255,255,0.9)">${lt}</text></g></svg></div>`;
}

function tname(id){return(TEAM_INFO[id]||{name:id.toUpperCase()}).name;}
// Normaliza para búsquedas: minúsculas + sin tildes/acentos.
const normTxt = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
// ¿Coincide una selección (por id) con la consulta ya normalizada? Casa por
// nombre sin tildes y por código de 3 letras (bel, bél, BÉLGICA, belgica…).
function teamHit(id, ql){
  if(!ql) return true;
  return normTxt(tname(id)).includes(ql) || id.toLowerCase().includes(ql);
}
// Orden de convocatoria: por posición (PO→DEF→MED→DEL) y dentro de cada
// posición por dorsal ascendente. Devuelve una copia; no muta el array original.
const POS_ORDER = {PO:0, DEF:1, MED:2, DEL:3};
function sortSquad(squad){
  const rank = p => (p.pos in POS_ORDER) ? POS_ORDER[p.pos] : 9;
  const num = p => (typeof p.n === 'number') ? p.n : 999;
  return squad.slice().sort((a,b) => (rank(a) - rank(b)) || (num(a) - num(b)));
}

function fmtDate(d){
  const dt=new Date(d+'T00:00:00');
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${dias[dt.getDay()].toUpperCase()} ${dt.getDate()} ${meses[dt.getMonth()].toUpperCase()}`;
}
function fmtDateShort(d){
  const dt=new Date(d+'T00:00:00');
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${dias[dt.getDay()]} ${dt.getDate()} ${meses[dt.getMonth()]}`;
}

  const isGroup = m.phase==='groups';
  const homeName = isGroup ? tname(m.home) : m.home;

  return `<div class="match-row${hi?' highlight':''}" onclick="openMatch('${m.id}')">
    <div class="m-home">
      ${homeFlag}
      <div class="m-home-info">
        <div class="m-team-name${isGroup?'':' ko'}">${homeName}</div>
      </div>
    </div>
    <div class="m-center">
      <div class="m-time${m.score?' score':''}">${m.score||m.time}</div>
      ${m.scoreLabel?`<div class="m-status${m.scoreLive?' live':''}">${m.scoreLabel}</div>`:''}
    </div>
    <div class="m-away">
      <div class="m-team-name${isGroup?'':' ko'}">${awayName}</div>
      ${awayFlag}
    </div>
    <div class="m-meta">
      ${isGroup?`${showDate?`<span class="m-date">${fmtDateShort(m.date)}</span><span class="m-sep">·</span>`:''}<span class="m-group">Grupo ${m.group}</span><span class="m-sep">·</span>`:`<span class="m-num">Partido ${m.id.replace('m','')}</span><span class="m-sep">·</span>`}
      <span class="m-venue">${m.venue.split(',')[1]?m.venue.split(',')[1].trim():m.venue}</span>
    </div>
  </div>`;
}

function renderMatches(){
  const ql=normTxt(q);
  let ms=MATCHES.filter(m=>{
    if(phase!=='all'&&m.phase!==phase)return false;
    if(ql){return teamHit(m.home,ql)||teamHit(m.away,ql);}
    return true;
  });
  const el=document.getElementById('matches-list');
  if(!ms.length){el.innerHTML='<div class="empty-state">Sin partidos para mostrar</div>';return;}

  // Fase de grupos → agrupar por grupo A-L
  if(phase==='groups'&&!ql){
    const byGroup={};
    ms.forEach(m=>{if(!byGroup[m.group])byGroup[m.group]=[];byGroup[m.group].push(m);});
    const groups=Object.keys(byGroup).sort();
    el.innerHTML=groups.map(g=>{
      const rows=byGroup[g];
      // Get the 4 teams in this group from the matches
      const teams=[];
      rows.forEach(m=>{if(!teams.includes(m.home))teams.push(m.home);if(!teams.includes(m.away))teams.push(m.away);});
      const teamsLabel=teams.map(t=>tname(t)).join(' · ');
      return `<div class="day-header">
        <div class="day-label">Grupo ${g}</div>
        <div class="day-rule"></div>
      </div>
      <div class="group-teams-strip">${teamsLabel}</div>`+
      rows.map(m=>matchRowHTML(m,ql,true)).join('');
    }).join('');
    return;
  }

  // Todos / fase eliminatoria / búsqueda → agrupar por fecha
  const byDate={};
  ms.forEach(m=>{if(!byDate[m.date])byDate[m.date]=[];byDate[m.date].push(m);});
  const dates=Object.keys(byDate).sort();
  el.innerHTML=dates.map(date=>{
    return `<div class="day-header"><div class="day-label">${fmtDate(date)}</div><div class="day-rule"></div></div>`+
    byDate[date].map(m=>matchRowHTML(m,ql)).join('');
  }).join('');
}

          const d=i+1,has=!!mdays[d],isTeam=teamDays.has(d),dim=ql&&has&&!isTeam;
          let cls='cal-day';if(has)cls+=' has-match';if(isTeam)cls+=' team-match';if(dim)cls+=' dimmed';
          return `<div class="${cls}" onclick="jumpDate('${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}')">${d}${has?'<div class="cal-dot"></div>':''}</div>`;
        }).join('')}

        const byDay={};

        return Object.keys(byDay).sort().map(date=>{

  }
  if(clubs.length){
    const capC=15,shownC=clubs.slice(0,capC);
    h+=`<div class="sr-sec"><div class="sr-sec-title">Clubes</div>${shownC.map(c=>{
      const list=cmap[c].slice().sort((a,b)=>a.id===b.id?a.p.n-b.p.n:tname(a.id).localeCompare(tname(b.id)));
      const capP=12,sp=list.slice(0,capP);
      return `<div class="sr-club-grp sr-list"><div class="sr-club-head"><span class="cn">${c}</span><span class="cc">· ${list.length} ${list.length===1?'jugador':'jugadores'}</span></div>${sp.map(x=>srRow(x.id,x.p,x.idx)).join('')}${list.length>capP?`<div class="sr-more">y ${list.length-capP} más</div>`:''}</div>`;

  }
  return h||'<div class="empty-state">Sin resultados</div>';
}

// ── Estadísticas de jugador: suma de /fixtures/players de los partidos jugados ──
// El id de API se recupera de la URL de la foto (/players/{id}.png). Caché por
// fixture para no repetir llamadas entre jugadores del mismo partido.
let psToken = 0;
const PS_FX_CACHE = {}; // fixtureId -> { playerId: {min,g,a,cards} }
const PS_PLAYED = ['FT','AET','PEN','HT','1H','2H','ET','BT','P','LIVE','INT','SUSP'];

function psPlayerApiId(p){
  const m = p && p.photo && String(p.photo).match(/\/players\/(\d+)\.png/);
  return m ? Number(m[1]) : null;
}

async function psFixturePlayers(fixtureId){
  if(PS_FX_CACHE[fixtureId]) return PS_FX_CACHE[fixtureId];
  const data = await apiFetch(`/fixtures/players?fixture=${fixtureId}`);
  const out = {};
  ((data && data.response) || []).forEach(t => (t.players || []).forEach(pp => {
    const id = pp.player && pp.player.id; if(id == null) return;
    const st = (pp.statistics && pp.statistics[0]) || {};
    const g = st.goals || {}, c = st.cards || {}, gm = st.games || {};
    out[id] = { min: gm.minutes || 0, g: g.total || 0, a: g.assists || 0, cards: (c.yellow || 0) + (c.red || 0) };
  }));
  PS_FX_CACHE[fixtureId] = out;
  return out;
}

async function psLoadPlayerStats(teamId, p, token){
  const pid = psPlayerApiId(p);
  if(pid == null) return; // sin foto -> sin id -> dejamos los 0
  const fixtures = MATCHES.filter(m => (m.home === teamId || m.away === teamId) && m.fixtureId && PS_PLAYED.indexOf(m.status) !== -1);
  if(!fixtures.length) return; // aún no ha jugado: 0 es correcto
  const tot = { min:0, g:0, a:0, cards:0 };
  for(const m of fixtures){
    let fx; try { fx = await psFixturePlayers(m.fixtureId); } catch(e){ continue; }
    if(token !== psToken) return; // el usuario abrió otra ficha entre tanto
    const s = fx[pid];
    if(s){ tot.min += s.min; tot.g += s.g; tot.a += s.a; tot.cards += s.cards; }
  }
  if(token !== psToken) return;
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  set('ps-st-g', tot.g);
  set('ps-st-a', tot.a);
  set('ps-st-min', tot.min + `'`);
  set('ps-st-cards', tot.cards);
}

function openPlayerSheet(teamId, playerIdx){
  const t = TEAM_INFO[teamId] || {};
  const sq = t.squad || [];
  const p = sq[playerIdx];
  if(!p) return;

  const teamMatches = MATCHES.filter(m => m.home===teamId || m.away===teamId);
  const initials = p.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  const avatarHTML = p.photo
    ? `<img src="${p.photo}" onerror="this.parentElement.textContent='${initials}'">`
    : initials;

  const posLabel = {PO:'Portero', DEF:'Defensa', MED:'Centrocampista', DEL:'Delantero'}[p.pos] || p.pos;

  // Edad y altura (la API devuelve "187 cm" → mostramos "1,87 m")
  const fmtHeight = h => {
    const cm = parseInt(String(h).replace(/[^0-9]/g,''), 10);
    return cm ? (cm/100).toFixed(2).replace('.', ',') + ' m' : '';
  };
  const metaBits = [];
  if(p.age) metaBits.push(p.age + ' años');
  if(p.height && fmtHeight(p.height)) metaBits.push(fmtHeight(p.height));
  const metaExtra = metaBits.length
    ? `<span style="font-size:12px;color:var(--text2);">· ${metaBits.join(' · ')}</span>`
    : '';

  document.getElementById('player-sheet-content').innerHTML = `
    <div class="ps-handle"></div>
    <div class="ps-hero">
      <div class="ps-avatar">${avatarHTML}</div>
      <div class="ps-hero-info">
        <div class="ps-num">${p.n}</div>
        <div class="ps-name">${p.name}</div>
        <div class="ps-meta" style="margin-top:6px; gap:8px; align-items:center;">
          <span class="ps-tag-pos">${posLabel}</span>
          ${metaExtra}
        </div>
        ${p.club ? `<div class="ps-club">· ${p.club} ·</div>` : ''}
      </div>
    </div>

    <div class="ps-stats">
      <div class="ps-stat"><span class="ps-stat-n" id="ps-st-g">0</span><span class="ps-stat-l">goles</span></div>
      <div class="ps-stat"><span class="ps-stat-n" id="ps-st-a">0</span><span class="ps-stat-l">asistencias</span></div>
      <div class="ps-stat"><span class="ps-stat-n" id="ps-st-min">0'</span><span class="ps-stat-l">minutos</span></div>
      <div class="ps-stat"><span class="ps-stat-n" id="ps-st-cards">0</span><span class="ps-stat-l">tarjetas</span></div>
    </div>

    <div class="ps-note" id="ps-note">Estadísticas del Mundial 2026</div>

    <div style="height:8px"></div>
  `;

  // Swipe down to close
  const box = document.getElementById('player-sheet-box');
  let startY = 0;
  box.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
  box.addEventListener('touchend', e => { if(e.changedTouches[0].clientY - startY > 60) closePlayerSheet(); }, {passive:true});

  document.getElementById('player-sheet').classList.add('open');

  // Estadísticas reales del torneo (suma de los partidos jugados del equipo).
  psLoadPlayerStats(teamId, p, ++psToken);
}

let MD = null; // { match, lineups:[local,visitante]|null|[], side:0|1 }

function openMatch(id){
  const m = MATCHES.find(x => x.id === id);
  if(!m) return;
  MD = { match:m, lineups:null, events:null, captains:null, nameById:null, side:0 };
  mdRender();
  requestAnimationFrame(()=>document.getElementById('match-detail').classList.add('open'));
  if(m.fixtureId){ mdFetchLineups(m.fixtureId); mdFetchEvents(m.fixtureId); mdFetchCaptains(m.fixtureId); }
  else { MD.lineups = '__none__'; mdRender(); }
}
function closeMatch(){ document.getElementById('match-detail').classList.remove('open'); }

async function mdFetchLineups(fixtureId){
  const data = await apiFetch(`/fixtures/lineups?fixture=${fixtureId}`);
  if(!MD || MD.match.fixtureId !== fixtureId) return; // el usuario cambió de partido
  const resp = data && data.response;
  MD.lineups = (resp && resp.length) ? resp : [];
  const nameById = {};
  if(Array.isArray(MD.lineups)) MD.lineups.forEach(t => {
    (t.startXI||[]).concat(t.substitutes||[]).forEach(e => {
      const p = e && e.player; if(p && p.id != null && p.name) nameById[p.id] = p.name;
    });
  });
  MD.nameById = nameById;
  mdRender();
}

// Goles y tarjetas desde /fixtures/events. El gol en propia suma al rival; el
// descuento se muestra como 90+4. Penalti "(p)", gol en propia "(pp)".
async function mdFetchEvents(fixtureId){
  const data = await apiFetch(`/fixtures/events?fixture=${fixtureId}`);
  if(!MD || MD.match.fixtureId !== fixtureId) return;
  const resp = (data && data.response) || [];
  const homeId = API_IDS[MD.match.home], awayId = API_IDS[MD.match.away];
  const ev = { home:[], away:[] };
  resp.forEach(e => {
    if(!e) return;
    const st = e.team && e.team.id;
    const detail = e.detail || '';
    const base = { min:(e.time && e.time.elapsed) || 0, extra:(e.time && e.time.extra) || 0, pid:(e.player && e.player.id), rawName:(e.player && e.player.name) || '' };
    if(e.type === 'Goal'){
      if(detail === 'Missed Penalty') return;
      const own = detail === 'Own Goal';
      const side = st===homeId ? (own?'away':'home') : st===awayId ? (own?'home':'away') : null;
      if(!side) return;
      ev[side].push(Object.assign(base, { kind:'goal', mark: own?' (pp)':(detail==='Penalty'?' (p)':'') }));
    } else if(e.type === 'Card'){
      const side = st===homeId ? 'home' : st===awayId ? 'away' : null;
      if(!side) return;
      ev[side].push(Object.assign(base, { kind:'card', red: /red/i.test(detail) }));
    } else if(e.type === 'subst'){
      const side = st===homeId ? 'home' : st===awayId ? 'away' : null;
      if(!side) return;
      ev[side].push({ kind:'subst', min:base.min, extra:base.extra,
        outPid:(e.player && e.player.id), outRaw:(e.player && e.player.name) || '',
        inPid:(e.assist && e.assist.id), inRaw:(e.assist && e.assist.name) || '' });
    }
  });
  const ord = (a,b) => (a.min + a.extra/100) - (b.min + b.extra/100);
  ev.home.sort(ord); ev.away.sort(ord);
  MD.events = ev;
  mdRender();
}

// Capitán desde /fixtures/players (statistics[].games.captain). Disponible cuando
// hay datos de jugadores del partido (en juego / finalizado), no antes.
async function mdFetchCaptains(fixtureId){
  const data = await apiFetch(`/fixtures/players?fixture=${fixtureId}`);
  if(!MD || MD.match.fixtureId !== fixtureId) return;
  const resp = (data && data.response) || [];
  const caps = new Set();
  resp.forEach(t => (t.players||[]).forEach(pp => {
    const isCap = (pp.statistics||[]).some(s => s.games && s.games.captain);
    if(isCap && pp.player && pp.player.id != null) caps.add(pp.player.id);
  }));
  MD.captains = caps;
  mdRender();
}

function mdResolve(pid, raw){
  const full = (MD && MD.nameById && pid != null && MD.nameById[pid]) || raw || '';
  return mdSurname(full);
}

function mdEventLine(it, right){
  const mn = `<span class="mn">${it.min}${it.extra?'+'+it.extra:''}'</span>`;
  if(it.kind === 'subst'){
    const swap = `<svg viewBox="0 0 24 24" width="18" height="16" style="flex:none" aria-hidden="true"><path d="M7 18V9" stroke="#2E7D32" stroke-width="2.2" stroke-linecap="round"/><path d="M7 3.5l3.6 5.5H3.4z" fill="#2E7D32"/><path d="M17 6v9" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"/><path d="M17 20.5l-3.6-5.5h7.2z" fill="#C0392B"/></svg>`;
    const names = `<span style="color:var(--text2)">${mdResolve(it.inPid,it.inRaw)}</span><span style="color:var(--text3)"> · ${mdResolve(it.outPid,it.outRaw)}</span>`;
    return right
      ? `<div class="lu-gl" style="justify-content:flex-end">${names}&nbsp;${mn}${swap}</div>`
      : `<div class="lu-gl">${swap}${mn}&nbsp;${names}</div>`;
  }
  const ball = `<img src="${BALL_IMG}" width="13" height="13" style="flex:none" alt="" aria-hidden="true">`;
  const card = `<span style="display:inline-block;width:8px;height:11px;border-radius:1.5px;flex:none;background:${it.red?'#C0392B':'#E0B83A'}"></span>`;
  const icon = it.kind === 'card' ? card : ball;
  const base = `${mdResolve(it.pid, it.rawName)}${it.mark||''}`;
  const nm = it.kind === 'goal' ? `<span style="color:var(--text1);font-weight:600">${base}</span>` : base;
  return right
    ? `<div class="lu-gl" style="justify-content:flex-end">${nm}&nbsp;${mn}${icon}</div>`
    : `<div class="lu-gl">${icon}${mn}&nbsp;${nm}</div>`;
}

function mdTeamLabel(m, side){
  const code = side===0 ? m.home : m.away;
  if(TEAM_INFO[code]) return tname(code);
  if(Array.isArray(MD.lineups) && MD.lineups[side] && MD.lineups[side].team) return MD.lineups[side].team.name;
  return code;
}

function mdRender(){
  if(!MD) return;
  const m = MD.match;
  const host = document.getElementById('match-detail-content');
  const hName = TEAM_INFO[m.home] ? tname(m.home) : m.home;
  const aName = TEAM_INFO[m.away] ? tname(m.away) : m.away;
  const sc = m.score ? m.score.split('—') : null;
  const scCenter = sc
    ? `<div class="lu-sc-n">${sc[0]||''}<span style="color:var(--text3);margin:0 7px">–</span>${sc[1]||''}</div><div class="lu-sc-l${m.scoreLive?' live':''}">${m.scoreLabel||''}</div>`
    : `<div class="lu-sc-n"><span style="font-size:18px;color:var(--text3)">vs</span></div><div class="lu-sc-l">${m.time?m.time+' h':''}</div>`;
  const E = MD.events || {home:[],away:[]};
  const homeEv = E.home.map(x=>mdEventLine(x,false)).join('');
  const awayEv = E.away.map(x=>mdEventLine(x,true)).join('');
  const luHead = `<div class="lu-head">
      <div class="lu-team">${TEAM_INFO[m.home]?flag(m.home,30):''}<span class="nm2">${hName}</span></div>
      <div>${scCenter}</div>
      <div class="lu-team">${TEAM_INFO[m.away]?`<span class="nm2">${aName}</span>${flag(m.away,30)}`:`<span class="nm2">${aName}</span>`}</div>
    </div>
    ${(homeEv||awayEv)?`<div class="lu-goals"><div>${homeEv}</div><div>${awayEv}</div></div>`:''}`;

  let body;
  if(MD.lineups === '__none__'){
    body = `<div class="empty-state" style="padding:30px 18px">Las alineaciones aparecerán cuando se acerque el partido.</div>`;
  } else if(MD.lineups === null){
    body = `<div class="empty-state" style="padding:30px 18px">Cargando alineaciones…</div>`;
  } else if(!MD.lineups.length){
    body = `<div class="empty-state" style="padding:30px 18px">Alineaciones aún no publicadas (salen poco antes del pitido).</div>`;
  } else {
    const side = MD.side;
    const lu = MD.lineups[side] || MD.lineups[0];
    body = `
      <div style="padding:0 14px">
        <div class="lu-toggle">
          <div class="lu-tab${side===0?' active':''}" onclick="mdSide(0)">${mdTeamLabel(m,0)}</div>
          <div class="lu-tab${side===1?' active':''}" onclick="mdSide(1)">${mdTeamLabel(m,1)}</div>
        </div>
      </div>
      <div class="lu-form">${lu.formation||''}</div>
      ${mdPitch(lu)}
      ${mdBench(lu)}
      ${lu.coach && lu.coach.name ? `<div class="lu-coach">DT&nbsp;·&nbsp;<span style="color:var(--text2)">${lu.coach.name}</span></div>` : ''}
    `;
  }

  host.innerHTML = `
    <div class="detail-head">
      <div class="back-btn" onclick="closeMatch()">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Volver
      </div>
      ${luHead}
    </div>
    ${body}
    <div style="height:8px"></div>
  `;
}

function mdSide(s){ if(!MD) return; MD.side = s; mdRender(); }

function mdSurname(name){
  if(!name) return '';
  const parts = String(name).trim().split(/\s+/);
  return parts.length>1 ? parts[parts.length-1] : parts[0];
}

function mdPlayer(p, yTop, xLeft, isOut){
  const initials = (p.name||'').split(/\s+/).map(w=>w[0]||'').join('').substring(0,2).toUpperCase();
  const img = p.id ? `<img src="${MEDIA_PLAYER}${p.id}.png" onerror="this.style.display='none'">` : '';
  const num = (p.number!=null) ? p.number : '';
  const cap = (MD && MD.captains && p.id != null && MD.captains.has(p.id)) ? `<span class="cap">C</span>` : '';
  const out = isOut ? `<span class="subout" title="Sustituido">${SUB_OUT_SVG}</span>` : '';
  return `<div class="pl" style="top:${yTop}%;left:${xLeft}%">
    <div class="av">${initials}${img}<span class="num">${num}</span>${cap}${out}</div>
    <div class="nm">${mdSurname(p.name)}</div>
  </div>`;
}

const SUB_OUT_SVG = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.4V7.2M2.3 4.8 5 7.8 7.7 4.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SUB_IN_SVG = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 8.6V2.8M2.3 5.2 5 2.2 7.7 5.2" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function mdSubSets(){
  const out = new Set(), inn = new Set();
  const ev = MD && MD.events;
  if(ev){ ['home','away'].forEach(s => (ev[s]||[]).forEach(e => {
    if(e && e.kind === 'subst'){ if(e.outPid!=null) out.add(e.outPid); if(e.inPid!=null) inn.add(e.inPid); }
  })); }
  return { out, inn };
}
function mdPitch(lu){
  const xi = (lu.startXI||[]).map(e => e.player).filter(Boolean);
  if(!xi.length) return `<div class="empty-state" style="padding:20px 18px">Sin once disponible.</div>`;
  const hasGrid = xi.every(p => p.grid && /^\d+:\d+$/.test(p.grid));
  const ln = 'rgba(184,150,90,.5)', ln2 = 'rgba(184,150,90,.42)';
  const marks = `

  const ss = mdSubSets();
  let chips = '';
  if(hasGrid){
    const rows = {};
    xi.forEach(p => { const r = parseInt(p.grid.split(':')[0],10); (rows[r]=rows[r]||[]).push(p); });
    const rowNums = Object.keys(rows).map(Number).sort((a,b)=>a-b);

      const ps = rows[r].sort((a,b)=> parseInt(a.grid.split(':')[1],10) - parseInt(b.grid.split(':')[1],10));

  return `<div class="pitch">${marks}${chips}</div>`;

const TM_R32 = [
  { id:'m73', home:{w:'A',pos:2}, away:{w:'B',pos:2} },
  { id:'m74', home:{w:'E',pos:1}, away:{third:['A','B','C','D','F']} },

];
// Adyacencia oficial de cada ronda: id -> [partido que aporta el local, el visitante].
const TM_ADJ = {
  r16:   { ids:['m89','m90','m91','m92','m93','m94','m95','m96'],
           from:[['m73','m75'],['m74','m77'],['m76','m78'],['m79','m80'],['m83','m84'],['m81','m82'],['m86','m88'],['m85','m87']] },
  qf:    { ids:['m97','m98','m99','m100'],
           from:[['m89','m90'],['m93','m94'],['m91','m92'],['m95','m96']] },
  sf:    { ids:['m101','m102'], from:[['m97','m98'],['m99','m100']] },
  final: { ids:['m104'], from:[['m101','m102']] }
};
// Empareja los 8 terceros elegidos con los 8 huecos de tercero (1-a-1).
function tmMatchThirds(slots, groups){
  const matchG = {}, result = new Array(slots.length).fill(null);
  function aug(i, vis){
    for(const g of slots[i].allowed){
      if(groups.indexOf(g)===-1 || vis.has(g)) continue;
      vis.add(g);
      if(matchG[g]==null || aug(matchG[g], vis)){ matchG[g]=i; result[i]=g; return true; }
    }
    return false;
  }
  for(let i=0;i<slots.length;i++) aug(i, new Set());
  return result;
}
function tmBuildR32(){
  const order = TM.order;
  const slots = TM_R32.filter(t => t.away.third).map(t => ({ id:t.id, allowed:t.away.third }));
  const assign = tmMatchThirds(slots, TM.thirds);
  const slotGroup = {}; slots.forEach((s,i) => slotGroup[s.id] = assign[i]);
  const resolve = (spec, id) => {
    if(spec.w) return (order[spec.w] || [])[spec.pos-1] || null;
    const g = slotGroup[id]; return g ? ((order[g]||[])[2]||null) : null;
  };
  return TM_R32.map(t => ({ id:t.id, home:resolve(t.home, t.id), away:resolve(t.away, t.id) }));
}
// Ganador efectivo: el elegido si sigue siendo válido en este cruce; si no, el local.
function tmWin(tie){
  if(!tie || !tie.home || !tie.away) return null;
  const p = TM.picks[tie.id];
  return (p===tie.home || p===tie.away) ? p : tie.home;
}
function tmAllRounds(){
  const byId = {};
  const r32 = tmBuildR32(); r32.forEach(t => byId[t.id] = t);
  const build = adj => adj.ids.map((id,k) => {
    const t = { id, home:tmWin(byId[adj.from[k][0]]), away:tmWin(byId[adj.from[k][1]]) };
    byId[id] = t; return t;
  });
  const r16 = build(TM_ADJ.r16), qf = build(TM_ADJ.qf), sf = build(TM_ADJ.sf), fin = build(TM_ADJ.final);
  return { r32, r16, qf, sf, fin };
}

// ── Fase 2: Tu Mundial vs el real ──
let TM_REAL;            // undefined = sin consultar; null = sin datos aún; objeto = datos
let tmRealLoading = false;
// Nombre de equipo de la API -> código local (reusa los alias de países).
function tmCodeFromName(name){
  if(!name) return null;
  const sq = s => apiNorm(s).replace(/[^a-z]/g,'');
  const target = sq(name);
  for(const code in API_NAME_ALIASES){
    for(const a of API_NAME_ALIASES[code]){
      const A = sq(a);
      if(A===target || target.includes(A) || A.includes(target)) return code;
    }
  }
  for(const code in TEAM_INFO){ if(sq(tname(code))===target) return code; }
  return null;
}
function tmRoundKey(roundStr){
  const r = (roundStr||'').toLowerCase();
  if(r.indexOf('round of 32')!==-1) return 'r32';
  if(r.indexOf('round of 16')!==-1) return 'r16';
  if(r.indexOf('quarter')!==-1) return 'qf';
  if(r.indexOf('semi')!==-1) return 'sf';
  if(r.indexOf('final')!==-1 && r.indexOf('3rd')===-1 && r.indexOf('third')===-1) return 'final';
  return null;
}
async function tmFetchReal(){
  const out = { groups:null, r32:new Set(), r16:new Set(), qf:new Set(), sf:new Set(), final:new Set(), champion:null, started:false };
  try{
    const st = await apiFetch(`/standings?league=${WC_LEAGUE}&season=${WC_SEASON}`);
    const arr = st && st.response && st.response[0] && st.response[0].league && st.response[0].league.standings;
    if(arr && arr.length){
      out.groups = {}; const thirds = [];
      arr.forEach(rows => {
        if(!rows || !rows.length) return;
        const gm = (rows[0].group||'').match(/Group ([A-L])/i);
        const g = gm ? gm[1].toUpperCase() : null;
        const codes = rows.map(r => tmCodeFromName(r.team && r.team.name));
        if(g) out.groups[g] = codes;
        if(rows.some(r => (r.points||0) > 0 || (r.all && r.all.played > 0))) out.started = true;
        if(codes[0]) out.r32.add(codes[0]);
        if(codes[1]) out.r32.add(codes[1]);
        if(rows[2]) thirds.push({ code:codes[2], pts:rows[2].points||0, gd:rows[2].goalsDiff||0, gf:(rows[2].all&&rows[2].all.goals&&rows[2].all.goals.for)||0 });
      });
      thirds.sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
      thirds.slice(0,8).forEach(t => { if(t.code) out.r32.add(t.code); });
    }
  }catch(e){ console.warn('tmFetchReal standings', e); }
  try{
    const fx = await apiFetch(`/fixtures?league=${WC_LEAGUE}&season=${WC_SEASON}`);
    const done = ['FT','AET','PEN'];
    const reach = { r32:'r16', r16:'qf', qf:'sf', sf:'final', final:'champion' };
    if(fx && fx.response){
      fx.response.forEach(f => {
        const status = f.fixture && f.fixture.status && f.fixture.status.short;
        if(done.indexOf(status)===-1) return;
        const rk = tmRoundKey(f.league && f.league.round);
        if(!rk) return;
        out.started = true;
        const win = f.teams.home.winner ? f.teams.home : (f.teams.away.winner ? f.teams.away : null);
        const code = win && tmCodeFromName(win.name);
        if(!code) return;
        if(reach[rk]==='champion') out.champion = code; else out[reach[rk]].add(code);
      });
    }
  }catch(e){ console.warn('tmFetchReal fixtures', e); }
  return out;
}
function tmPredictedSets(){
  const R = tmAllRounds();
  const wins = ties => ties.map(tmWin).filter(Boolean);
  return {
    r32: new Set([].concat(...R.r32.map(t => [t.home, t.away])).filter(Boolean)),
    r16: new Set(wins(R.r32)), qf: new Set(wins(R.r16)),
    sf: new Set(wins(R.qf)), final: new Set(wins(R.sf)), champion: tmWin(R.fin[0])
  };
}
function tmInter(predSet, realSet){ let n=0; predSet.forEach(c => { if(realSet.has(c)) n++; }); return n; }
function tmScoreOpen(){ TM.step='score'; tmSave(); render(); tmEnsureReal(); }
function tmScoreBack(){ TM.step='bracket'; TM.ri=3; tmSave(); render(); }
function tmEnsureReal(){
  if(TM_REAL!==undefined || tmRealLoading) return;
  tmRealLoading = true;
  tmFetchReal().then(r => { TM_REAL = (r && r.started) ? r : null; tmRealLoading=false; if(TM.step==='score') render(); })
               .catch(() => { TM_REAL=null; tmRealLoading=false; if(TM.step==='score') render(); });
}
function tmScoreBackBtn(){ return `<div class="tm-nav"><button class="tm-btn" onclick="tmScoreBack()">← Volver al cuadro</button></div>`; }
function tmScoreHTML(){
  let h = `<div class="tm-wrap"><div class="tm-title">Tu Mundial vs el real</div>`;
  if(TM_REAL===undefined){ tmEnsureReal(); return h + `<div class="tm-hint">Consultando resultados…</div>` + tmScoreBackBtn() + '</div>'; }
  if(TM_REAL===null){ return h + `<div class="tm-intro" style="margin-top:6px"><p>El torneo aún no ha empezado, o todavía no hay resultados. Aquí verás tus aciertos en cuanto los haya.</p></div>` + tmScoreBackBtn() + '</div>'; }
  const pred = tmPredictedSets(), real = TM_REAL;
  let gExact=0, gTotal=0;
  if(real.groups) Object.keys(real.groups).forEach(g => {
    const rr = real.groups[g], uo = TM.order[g] || [];
    rr.forEach((code,i) => { if(code){ gTotal++; if(uo[i]===code) gExact++; } });
  });
  const rows = [];
  if(gTotal) rows.push(['Grupos · posiciones exactas', gExact, gTotal]);
  if(real.r16.size)   rows.push(['Octavofinalistas', tmInter(pred.r16, real.r16), 16]);
  if(real.qf.size)    rows.push(['Cuartofinalistas', tmInter(pred.qf, real.qf), 8]);
  if(real.sf.size)    rows.push(['Semifinalistas', tmInter(pred.sf, real.sf), 4]);
  if(real.final.size) rows.push(['Finalistas', tmInter(pred.final, real.final), 2]);
  h += `<div class="tm-hint">Comparamos tu cuadro con los resultados reales según van cayendo.</div>`;
  if(rows.length) h += `<div class="tm-card">` + rows.map(r => `<div class="tm-row"><span class="tm-nm">${r[0]}</span><b style="color:var(--gold);font-size:15px;">${r[1]}/${r[2]}</b></div>`).join('') + `</div>`;

  }
  return h + tmScoreBackBtn() + '</div>';
}

        navigator.share({ files:[file], title:'Mi Mundial 2026', text:'Mi porra del Mundial 2026' }).catch(()=>{});

// Mapa inverso: ID de equipo en API -> código local. Para emparejar fixtures

async function apiFetch(endpoint){

async function loadFixtures(){
  showApiStatus('Actualizando resultados…');
  const data = await apiFetch(`/fixtures?league=${WC_LEAGUE}&season=${WC_SEASON}`);
  if(!data || !data.response){ hideApiStatus(); return; }

  data.response.forEach(f => {
    const hId = f.teams.home.id, aId = f.teams.away.id;
    const hCode = ID_TO_CODE[hId], aCode = ID_TO_CODE[aId];
    const home = f.teams.home.name.toLowerCase();
    const away = f.teams.away.name.toLowerCase();
    const date = f.fixture.date?.substring(0,10);
    const status = f.fixture.status.short;
    const elapsed = f.fixture.status.elapsed;
    const extraMin = f.fixture.status.extra;

    // 1) Emparejar por ID de equipo (a prueba de idiomas), en cualquier
    //    orientación. Si está invertida respecto a nuestro MATCHES, marcamos
    //    swap para voltear el marcador y mantener el orden local local—visitante.
    let match = null, swap = false;
    if(hCode && aCode){
      match = MATCHES.find(m => m.home === hCode && m.away === aCode);
      if(!match){
        match = MATCHES.find(m => m.home === aCode && m.away === hCode);
        if(match) swap = true;
      }
    }
    // 2) Respaldo: por nombre y, en último caso, por fecha (como antes).
    if(!match){
      match = MATCHES.find(m => {
        const mh = tname(m.home).toLowerCase();
        const ma = tname(m.away).toLowerCase();
        return (mh === home || mh.includes(home.split(' ')[0])) &&
               (ma === away || ma.includes(away.split(' ')[0]));
      }) || MATCHES.find(m => m.date === date && !m.fixtureId);
    }

    if(!match) return;

    match.fixtureId = f.fixture.id;
    match.status = status;

    const liveStatuses = ['1H','2H','HT','ET','P','BT'];
    const finishedStatuses = ['FT','AET','PEN'];

    if([...liveStatuses, ...finishedStatuses].includes(status)){
      let h = f.goals.home ?? 0;
      let a = f.goals.away ?? 0;
      if(swap){ const t = h; h = a; a = t; }
      match.score = `${h}—${a}`;
      match.scoreLive = liveStatuses.includes(status);
      match.scoreLabel = status === 'HT' ? 'Descanso' :
                         finishedStatuses.includes(status) ? 'Final' :
                         `${elapsed}${extraMin?'+'+extraMin:''}'`;
    } else {
      match.score = null;
      match.scoreLive = false;
      match.scoreLabel = null;
    }
  });

  hideApiStatus();
  render();

  // Si hay un partido abierto, refresca su panel: la cabecera (minuto / Final) al
  // instante y los eventos desde la API (nuevos goles/tarjetas/cambios).
  if(MD && MD.match && MD.match.fixtureId){
    mdRender();
    mdFetchEvents(MD.match.fixtureId);
  }

  // Auto-refresh if live matches
  clearTimeout(liveRefreshTimer);
  if(MATCHES.some(m => m.scoreLive)){
    liveRefreshTimer = setTimeout(loadFixtures, 60000);
  }
}

// Normalización de nombres compartida por el cargador y el diagnóstico.
const apiNorm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[.'`´’\-]/g,' ').replace(/\s+/g,' ').trim();
const apiToks = s => apiNorm(s).split(' ').filter(w => w.length >= 4);

// Las fotos de API-Football tienen URL determinista por id de jugador.
const MEDIA_PLAYER = 'https://media.api-sports.io/football/players/';
// Overrides manuales (camino "por ID") para los casos que NO casan por nombre
// —apodos como Pedri/Gavi— o jugadores sin foto en /players/squads. Clave:
// código de selección; dentro: nombre local EXACTO -> id de jugador de API.
// No gasta llamadas: se construye la URL de la foto directamente.
// Rellénalo con lo que saque discoverUnmatched() (abre la selección + "#fotos-<código>").
const PHOTO_OVERRIDES = {
  // esp: { 'Pedri': 0, 'Gavi': 0 },   // ejemplo: cambia 0 por el id real de la API
};

// Empareja la plantilla local con una lista de la API (items normalizados a
// {name, number, photo, age, height, id}) por nombre y 1-a-1. Devuelve un Map
// índiceLocal -> item de la API, además de los índices usados (para diagnóstico).
function matchSquad(team, items){
  const locals = team.squad.map((s, i) => ({ i, tok: apiToks(s.name) }));
  const apis   = items.map((a, ai) => ({ ai, tok: apiToks(a.name) }));
  const pairs = [];
  locals.forEach(L => {
    apis.forEach(A => {
      let shared = 0;
      L.tok.forEach(w => { if(A.tok.indexOf(w) !== -1) shared++; });
      if(!shared) return;
      // El nombre manda: más palabras en común siempre gana. El dorsal solo
      // desempata empates de nombre (por eso pesa 1, no debe superar el nombre).
      let score = shared * 1000;
      const an = items[A.ai].number, ln = team.squad[L.i].n;
      if(an != null && ln != null && Number(an) === Number(ln)) score += 1;
      pairs.push({ score, li: L.i, ai: A.ai });
    });
  });
  pairs.sort((x, y) => y.score - x.score);
  const usedLocal = new Set(), usedApi = new Set(), map = new Map();
  pairs.forEach(pr => {
    if(usedLocal.has(pr.li) || usedApi.has(pr.ai)) return;
    usedLocal.add(pr.li); usedApi.add(pr.ai);
    map.set(pr.li, items[pr.ai]);
  });
  return { map, usedLocal, usedApi };
}

// Rellena SOLO foto/edad/altura desde la API. Nunca toca dorsal, posición ni
// club (lo manual manda). Aplica además los PHOTO_OVERRIDES por id para los
// que no casan por nombre.
function fillFromApi(team, teamCode, items){
  const { map } = matchSquad(team, items);
  let count = 0;
  map.forEach((a, li) => {
    const local = team.squad[li];
    if(a.photo) local.photo = a.photo;
    if(a.age != null) local.age = a.age;
    if(a.height) local.height = a.height;
    count++;
  });
  const ov = PHOTO_OVERRIDES[teamCode] || {};
  team.squad.forEach(p => {
    const id = ov[p.name];
    if(id && !p.photo){ p.photo = MEDIA_PLAYER + id + '.png'; count++; }
  });
  return count;
}

// Fotos + edad desde /players/squads: plantilla actual, no depende de temporada,
// así que responde ya (al contrario que /players?season=2026, vacío hasta el torneo).
async function loadPlayerPhotos(teamLocalId, teamApiId){
  if(!teamApiId) return 0;
  const team = TEAM_INFO[teamLocalId];
  if(!team || !team.squad) return 0;
  const data = await apiFetch(`/players/squads?team=${teamApiId}`);
  const players = data && data.response && data.response[0] && data.response[0].players;
  if(!players || !players.length) return 0;
  const items = players.map(p => ({ name: p.name, number: p.number, photo: p.photo, age: p.age }));
  return fillFromApi(team, teamLocalId, items);
}

// Altura desde /players?team=&season=2026 (la altura solo vive aquí, no en
// /players/squads). Está vacío hasta ~inicio del torneo. Paginado, con tope de 3
// páginas para no gastar cuota (una selección cabe de sobra en 1-2 páginas).
async function loadPlayerHeights(teamLocalId, teamApiId){
  if(!teamApiId) return 0;
  const team = TEAM_INFO[teamLocalId];
  if(!team || !team.squad) return 0;
  const items = [];
  let page = 1, totalPages = 1;
  do {
    const data = await apiFetch(`/players?team=${teamApiId}&season=${WC_SEASON}&page=${page}`);
    const resp = data && data.response;
    if(!resp || !resp.length) break;
    resp.forEach(r => {
      const pl = r.player || {};
      const name = ((pl.firstname || '') + ' ' + (pl.lastname || '')).trim() || pl.name;
      items.push({ name, number: null, photo: pl.photo, age: pl.age, height: pl.height });
    });
    totalPages = (data.paging && data.paging.total) || 1;
    page++;
  } while(page <= totalPages && page <= 3);
  if(!items.length) return 0;
  return fillFromApi(team, teamLocalId, items);
}

// Orquestador: al abrir una selección pide sus datos a la API una sola vez por
// sesión y, si llegan, repinta la ficha (foto, edad y altura).
// Nunca toca dorsales ni clubes: lo manual manda siempre.
async function ensureSquadData(id){
  const t = TEAM_INFO[id], apiId = API_IDS[id];
  if(!t || !apiId) return;
  if(t._apiLoaded && t._heightLoaded) return;
  showApiStatus('Cargando datos del equipo…');
  let nFotos = 0, nAltura = 0;
  if(!t._apiLoaded){
    try { nFotos = await loadPlayerPhotos(id, apiId); if(nFotos > 0) t._apiLoaded = true; }
    catch(e){ console.warn('Cargador (fotos):', e); }
  }
  if(!t._heightLoaded){
    // La fuente de altura puede estar vacía aún; marcamos el intento hecho en
    // esta sesión para no repetir llamadas (al recargar la app se reintenta).
    try { nAltura = await loadPlayerHeights(id, apiId); }
    catch(e){ console.warn('Cargador (altura):', e); }
    t._heightLoaded = true;
  }
  if(nFotos > 0 || nAltura > 0){
    showApiStatus(`Datos cargados (fotos ${nFotos}, alturas ${nAltura})`);
    hideApiStatus();
    if(currentTeamId === id) openTeam(id);
  } else {
    showApiStatus('La API no devolvió datos');
    hideApiStatus();
  }
}

// Diagnóstico de fotos: para una selección, lista los jugadores locales que se
// quedan SIN foto y los jugadores de la API que NO se usaron (con su id), para
// rellenar PHOTO_OVERRIDES con precisión. Úsalo abriendo la app con
// "#fotos-<código>" (p. ej. #fotos-esp) o llamando discoverUnmatched('esp').
async function discoverUnmatched(code){
  code = (code || currentTeamId || '').toLowerCase();
  const t = code && TEAM_INFO[code], apiId = code && API_IDS[code];
  if(!t){ showDiscoverResult('Abre una selección primero, o usa #fotos-<código> (p. ej. #fotos-esp).'); return; }
  if(!apiId){ showDiscoverResult('La selección ' + code + ' no tiene API_ID asignado.'); return; }
  showApiStatus('Analizando fotos…');
  const data = await apiFetch(`/players/squads?team=${apiId}`);
  hideApiStatus();
  const players = data && data.response && data.response[0] && data.response[0].players;
  if(!players || !players.length){ showDiscoverResult('La API no devolvió plantilla para ' + t.name + '.'); return; }
  const items = players.map(p => ({ name: p.name, number: p.number, photo: p.photo, id: p.id }));
  const { map, usedApi } = matchSquad(t, items);
  const sinFoto = [];
  t.squad.forEach((p, i) => {
    const a = map.get(i);
    if(!(a && a.photo) && !(p.photo)) sinFoto.push(`${p.n} ${p.name} (${p.pos})`);
  });
  const sobran = items
    .map((a, ai) => ({ a, ai }))
    .filter(x => !usedApi.has(x.ai))
    .map(x => `${x.a.id}  ${x.a.name}${x.a.photo ? '  [con foto]' : '  [sin foto]'}`);
  let out = `=== Fotos: ${t.name} ===\nCasadas: ${map.size}/${t.squad.length}\n`;
  out += `\nLocales SIN foto (${sinFoto.length}):\n` + (sinFoto.length ? '- ' + sinFoto.join('\n- ') : '(ninguno)');
  out += `\n\nJugadores de la API sin usar (${sobran.length}) — usa el id para PHOTO_OVERRIDES:\n` + (sobran.length ? '- ' + sobran.join('\n- ') : '(ninguno)');
  out += `\n\nDime los pares  nombre_local -> id  y los fijo en PHOTO_OVERRIDES.`;
  console.log('\n' + out);
  showDiscoverResult(out);
}
